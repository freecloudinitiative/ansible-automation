---
- name: Pre-setup
  hosts: all
  become: true
  roles:
    - raspberry-pi-boot-config
    - k3s-presetup

- name: Setup K3s master node
  hosts: master
  become: true
  roles:
    - k3s-master-setup

- name: Setup K3s worker nodes
  hosts: workers
  become: true
  vars:
    k3s_master_ip: "{{ hostvars[groups['master'][0]]['k3s_master_ip'] }}"
    k3s_node_token: "{{ hostvars[groups['master'][0]]['k3s_node_token']['content'] | b64decode | trim }}"
  roles:
    - k3s-worker-setup

- name: Configure K3s node labels and taints
  hosts: master
  roles:
    - k3s-node-labeling
    - argocd-setup
