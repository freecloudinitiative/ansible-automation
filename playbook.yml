---
- name: Setup K3s master nodes
  hosts: masters
  become: true
  gather_facts: true
  roles:
    - k3s-pre-setup
    - k3s-master-setup
    - k3s-fact-gathering

- name: Setup K3s worker nodes
  hosts: workers
  become: true
  gather_facts: true
  vars:
    k3s_node_token: "{{ hostvars[groups['masters'][0]]['k3s_node_token']['content'] | b64decode | trim }}"
  roles:
    - k3s-pre-setup
    - k3s-worker-setup

- name: Install K3S Components
  hosts: "{{ groups['masters'][0] }}"
  become: true
  gather_facts: false
  vars:
    k3s_node_token: "{{ hostvars[groups['masters'][0]]['k3s_node_token']['content'] | b64decode | trim }}"
  roles:
    - k3s-node-labeling
    - argocd-setup
    # GitOps installs cert-manager and the private CA issuer required by OpenBao.
    - argocd-bootstrap
    - openbao-setup
    - openbao-secrets-init
    - k9s-setup

  post_tasks:
    - name: Print NodePort Service URLs and Passwords in JSON format
      ansible.builtin.debug:
        msg:
          argocd: "http://{{ k3s_master1_public_ip }}/argocd/"
          grafana: "http://{{ k3s_master1_public_ip }}/grafana/"
          prometheus: "http://{{ k3s_master1_public_ip }}/prometheus/"
          openbao: "http://{{ k3s_master1_public_ip }}/ui/"
          authentik: "http://{{ k3s_master1_public_ip }}:30900/"
          alloy: "http://{{ k3s_master1_public_ip }}/alloy"
          traefik_dashboard: "http://{{ k3s_master1_public_ip }}/traefik-dashboard/"
          frontend: "http://{{ k3s_master1_public_ip }}/frontend"
          # argocd_password: "{{ argocd_admin_password | default('') }}"
          # grafana_password: "{{ grafana_admin_password | default('') }}"
          # openbao_password: "{{ openbao_token | default(openbao_dev_root_token | default('root')) }}"
