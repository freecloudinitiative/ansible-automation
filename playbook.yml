---
- name: Setup K3s master node
  hosts: masters
  become: true
  roles:
    - k3s-pre-setup
    - k3s-master-setup
    - k3s-fact-gathering

- name: Setup K3s worker nodes
  hosts: workers
  become: true
  vars:
    k3s_master_ip: "{{ hostvars[groups['masters'][0]]['k3s_master_ip'] }}"
    k3s_node_token: "{{ hostvars[groups['masters'][0]]['k3s_node_token']['content'] | b64decode | trim }}"
  roles:
    - k3s-pre-setup
    - k3s-worker-setup

- name: Install K3S Components
  hosts: "{{ groups['masters'][0] }}"
  become: true
  vars:
    k3s_master_ip: "{{ hostvars[groups['masters'][0]]['k3s_master_ip'] }}"
    k3s_node_token: "{{ hostvars[groups['masters'][0]]['k3s_node_token']['content'] | b64decode | trim }}"
  roles:
    - k3s-node-labeling
    - argocd-setup
    - gitea-setup
    - argocd-bootstrap
    - sealed-secret-setup
    - cert-manager-setup
    - prometheus-stack-setup
    - loki-setup
    - tempo-setup
    - alloy-setup
    - open-telemetry-setup
    - kyverno-setup
    - linkerd-setup
    - harbor-setup
