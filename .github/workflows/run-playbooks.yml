name: Run Ansible Playbooks

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Select the playbook to execute'
        required: true
        type: choice
        options:
          - pi-boot
          - playbook
          - thermal check

jobs:
  run-playbook:
    name: Run Ansible Playbook
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Determine playbook file
        id: determine-playbook
        run: |
          PLAYBOOK="${{ github.event.inputs.playbook }}"
          if [ "$PLAYBOOK" = "pi-boot" ]; then
            echo "file=pi-boot.yml" >> $GITHUB_OUTPUT
          elif [ "$PLAYBOOK" = "playbook" ]; then
            echo "file=playbook.yml" >> $GITHUB_OUTPUT
          elif [ "$PLAYBOOK" = "thermal check" ]; then
            echo "file=thermal-check.yml" >> $GITHUB_OUTPUT
          else
            echo "Unsupported playbook choice: $PLAYBOOK"
            exit 1
          fi

      - name: Run Ansible playbook
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan master worker-1 worker-2 worker-3 >> ~/.ssh/known_hosts 2>/dev/null
          ansible-playbook -i inventory.ini ${{ steps.determine-playbook.outputs.file }}
