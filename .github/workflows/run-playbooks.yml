name: Run Ansible Playbooks

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Select the playbook to execute'
        required: true
        type: choice
        options:
          - pi-boot
          - playbook
          - thermal check
      cloud_provider:
        description: 'Select Cloud Provider'
        required: true
        default: 'gcp'
        type: choice
        options:
          - gcp
          - aws
          - azure
      master_1_ip:
        description: 'IP for master-1 (optional override)'
        required: false
        type: string
      master_2_ip:
        description: 'IP for master-2 (optional HA master)'
        required: false
        type: string
      master_3_ip:
        description: 'IP for master-3 (optional HA master)'
        required: false
        type: string
      worker_1_ip:
        description: 'IP for worker-1 (optional override)'
        required: false
        type: string
      worker_2_ip:
        description: 'IP for worker-2 (optional override)'
        required: false
        type: string
      worker_3_ip:
        description: 'IP for worker-3 (optional override)'
        required: false
        type: string

jobs:
  run-playbook:
    name: Run Ansible Playbook
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.GCP_SSH_PRIVATE_KEY }}
            ${{ secrets.AWS_SSH_PRIVATE_KEY }}
            ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
            ${{ secrets.SSH_PRIVATE_KEY }}


      - name: Create Vault password file
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          if [ -n "$VAULT_PASS" ]; then
            echo "$VAULT_PASS" > .vault_pass
          fi

      - name: Configure SSH host mapping
        env:
          ANSIBLE_ASK_VAULT_PASS: "False"
          MASTER_1_IP: ${{ github.event.inputs.master_1_ip }}
          MASTER_2_IP: ${{ github.event.inputs.master_2_ip }}
          MASTER_3_IP: ${{ github.event.inputs.master_3_ip }}
          WORKER_1_IP: ${{ github.event.inputs.worker_1_ip }}
          WORKER_2_IP: ${{ github.event.inputs.worker_2_ip }}
          WORKER_3_IP: ${{ github.event.inputs.worker_3_ip }}
        run: |
          EXTRA_VARS=""
          PAIRS=""
          [ -n "$MASTER_1_IP" ] && PAIRS="'master-1':'$MASTER_1_IP'"
          [ -n "$MASTER_2_IP" ] && PAIRS="${PAIRS:+$PAIRS,}'master-2':'$MASTER_2_IP'"
          [ -n "$MASTER_3_IP" ] && PAIRS="${PAIRS:+$PAIRS,}'master-3':'$MASTER_3_IP'"
          [ -n "$WORKER_1_IP" ] && PAIRS="${PAIRS:+$PAIRS,}'worker-1':'$WORKER_1_IP'"
          [ -n "$WORKER_2_IP" ] && PAIRS="${PAIRS:+$PAIRS,}'worker-2':'$WORKER_2_IP'"
          [ -n "$WORKER_3_IP" ] && PAIRS="${PAIRS:+$PAIRS,}'worker-3':'$WORKER_3_IP'"
          if [ -n "$PAIRS" ]; then
            EXTRA_VARS="--extra-vars ssh_hosts={$PAIRS}"
          fi
          VAULT_ARG=""
          if [ -f .vault_pass ]; then
            VAULT_ARG="--vault-password-file .vault_pass"
          fi
          ansible-playbook ssh-config.yml $EXTRA_VARS $VAULT_ARG

      - name: Populate known hosts dynamically
        run: |
          mkdir -p ~/.ssh
          grep -i HostName ~/.ssh/config | awk '{print $2}' | xargs -r ssh-keyscan >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Determine playbook file
        id: determine-playbook
        run: |
          PLAYBOOK="${{ github.event.inputs.playbook }}"
          if [ "$PLAYBOOK" = "pi-boot" ]; then
            echo "file=pi-boot.yml" >> $GITHUB_OUTPUT
          elif [ "$PLAYBOOK" = "playbook" ]; then
            echo "file=playbook.yml" >> $GITHUB_OUTPUT
          elif [ "$PLAYBOOK" = "thermal check" ]; then
            echo "file=thermal-check.yml" >> $GITHUB_OUTPUT
          else
            echo "Unsupported playbook choice: $PLAYBOOK"
            exit 1
          fi

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_ASK_VAULT_PASS: "False"
        run: |
          VAULT_ARG=""
          if [ -f .vault_pass ]; then
            VAULT_ARG="--vault-password-file .vault_pass"
          fi
          ansible-playbook -i inventory.ini ${{ steps.determine-playbook.outputs.file }} $VAULT_ARG

      - name: Clean up Vault password file
        if: always()
        run: rm -f .vault_pass



