name: Run Ansible Playbooks

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Select the playbook to execute'
        required: true
        type: choice
        options:
          - pi-boot
          - playbook
          - thermal check

jobs:
  run-playbook:
    name: Run Ansible Playbook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        # Only attempt to run if SSH_PRIVATE_KEY is defined
        continue-on-error: true

      - name: Determine playbook file
        id: determine-playbook
        run: |
          PLAYBOOK="${{ github.event.inputs.playbook }}"
          if [ "$PLAYBOOK" = "pi-boot" ]; then
            echo "file=pi-boot.yml" >> $GITHUB_OUTPUT
          elif [ "$PLAYBOOK" = "playbook" ]; then
            echo "file=playbook.yml" >> $GITHUB_OUTPUT
          elif [ "$PLAYBOOK" = "thermal check" ]; then
            echo "file=thermal-check.yml" >> $GITHUB_OUTPUT
          else
            echo "Unsupported playbook choice: $PLAYBOOK"
            exit 1
          fi

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory.ini ${{ steps.determine-playbook.outputs.file }}
