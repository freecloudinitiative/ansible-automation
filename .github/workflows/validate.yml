name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-secrets:
    name: Validate Vault Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Guard — verify secret.yml is encrypted
        run: |
          if [ -f "group_vars/all/secret.yml" ]; then
            head -1 group_vars/all/secret.yml | grep -q '^\$ANSIBLE_VAULT;1\.[12];AES256' \
              || { echo "secret.yml is not encrypted or malformed — refusing to continue"; exit 1; }
          fi
