---
- name: Configure Local SSH & Clean Known Hosts
  hosts: localhost
  connection: local
  become: false

  vars:
    ssh_config_clean_known_hosts: true
    ssh_hosts:
      master-1:
        hostname: "{{ k3s_master1_public_ip }}"
        cloud: aws
      #master-2:
      #  hostname: "{{ k3s_master2_public_ip }}"
      #  cloud: aws
      #master-3:
      #  hostname: "{{ k3s_master3_public_ip }}"
      #  cloud: aws
      worker-1:
        hostname: "{{ k3s_worker1_public_ip }}"
        cloud: aws
      worker-2:
        hostname: "{{ k3s_worker2_public_ip }}"
        cloud: aws
      worker-3:
        hostname: "{{ k3s_worker3_public_ip }}"
        cloud: aws
      worker-4:
        hostname: "{{ k3s_worker4_public_ip }}"
        cloud: aws
      worker-5:
        hostname: "{{ k3s_worker5_public_ip }}"
        cloud: aws
      worker-6:
        hostname: "{{ k3s_worker6_public_ip }}"
        cloud: aws

  roles:
    - ssh-config-setup
