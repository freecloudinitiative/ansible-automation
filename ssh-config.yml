---
- name: Configure Local SSH & Clean Known Hosts
  hosts: localhost
  connection: local
  become: false

  vars:
    ssh_config_clean_known_hosts: true
    ssh_hosts:
      master-1: "34.29.93.1"
      # master-2: "x.x.x.x"
      # master-3: "x.x.x.x"
      worker-1: "34.135.18.72"
      worker-2: "34.63.129.94"
      worker-3: "34.46.241.10"

  roles:
    - ssh-config-setup
