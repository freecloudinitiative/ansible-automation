---
- name: Validate cert-manager configuration
  ansible.builtin.assert:
    that:
      - cert_manager_issuer_type in ['selfsigned', 'letsencrypt-staging', 'letsencrypt-production']
      - cert_manager_issuer_type == 'selfsigned' or (cert_manager_letsencrypt_email is defined and cert_manager_letsencrypt_email | length > 0)
    fail_msg: >-
      Invalid cert_manager_issuer_type (must be selfsigned, letsencrypt-staging, or letsencrypt-production)
      or missing cert_manager_letsencrypt_email when using Let's Encrypt issuer.

- name: Create cert-manager stack directory
  ansible.builtin.file:
    path: "{{ cert_manager_stack_dir }}"
    state: directory
    mode: "0755"

- name: Add Jetstack Helm repo
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: "{{ cert_manager_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Ensure cert-manager namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ cert_manager_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Render cert-manager values from template
  ansible.builtin.template:
    src: cert-manager-values.yaml.j2
    dest: "{{ cert_manager_stack_dir }}/cert-manager-values.yaml"
    mode: "0644"

- name: Install cert-manager via Helm
  kubernetes.core.helm:
    name: "{{ cert_manager_release_name }}"
    chart_ref: jetstack/cert-manager
    release_namespace: "{{ cert_manager_namespace }}"
    create_namespace: false
    values_files:
      - "{{ cert_manager_stack_dir }}/cert-manager-values.yaml"
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 5m
    state: present

- name: Wait for cert-manager webhook to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=Available
      - deployment/cert-manager-webhook
      - -n
      - "{{ cert_manager_namespace }}"
      - --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Render ClusterIssuer manifest from template
  ansible.builtin.template:
    src: cluster-issuer.yaml.j2
    dest: "{{ cert_manager_stack_dir }}/cluster-issuer.yaml"
    mode: "0644"

- name: Apply ClusterIssuer
  kubernetes.core.k8s:
    state: present
    src: "{{ cert_manager_stack_dir }}/cluster-issuer.yaml"
    kubeconfig: "{{ kubeconfig_path }}"

- name: Verify ClusterIssuer is ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=Ready
      - clusterissuer
      - "{{ 'selfsigned-cluster-issuer' if cert_manager_issuer_type == 'selfsigned' else cert_manager_issuer_type }}"
      - "{{ 'ca-cluster-issuer' if cert_manager_issuer_type == 'selfsigned' else omit }}"
      - --timeout=60s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Display cert-manager setup info
  ansible.builtin.debug:
    msg:
      status: "cert-manager installed and ClusterIssuer ready"
      issuer_type: "{{ cert_manager_issuer_type }}"
      namespace: "{{ cert_manager_namespace }}"
      access_url: "http://{{ k3s_master_public_ip | default(ansible_host | default(k3s_master_ip | default(ansible_facts['default_ipv4']['address']))) }}:9402/metrics"
      note: >-
        Use 'ca-cluster-issuer' (selfsigned) or 'letsencrypt-production'
        in your Certificate and Ingress resources
