---
cert_manager_namespace: cert-manager
cert_manager_stack_dir: "{{ '~/k3s-stack/cert-manager' | expanduser }}"
cert_manager_release_name: cert-manager
cert_manager_helm_repo_url: https://charts.jetstack.io
cert_manager_kubeconfig: "{{ kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}"

# ClusterIssuer configuration
# Options: selfsigned, letsencrypt-staging, letsencrypt-production
cert_manager_issuer_type: selfsigned
cert_manager_letsencrypt_email: ""
cert_manager_letsencrypt_staging_url: https://acme-staging-v02.api.letsencrypt.org/directory
cert_manager_letsencrypt_production_url: https://acme-v02.api.letsencrypt.org/directory
