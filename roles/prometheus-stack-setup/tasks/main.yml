---
- name: Validate grafana_admin_password is set
  ansible.builtin.assert:
    that:
      - grafana_admin_password is string
      - (grafana_admin_password | trim | length) > 0
    fail_msg: "grafana_admin_password must be a non-empty string."

- name: Create monitoring stack directory
  ansible.builtin.file:
    path: "{{ prometheus_stack_dir }}"
    state: directory
    mode: "0755"

- name: Verify Python version requirement
  ansible.builtin.assert:
    that:
      - ansible_facts.python_version is version('3.9', '>=')
    fail_msg: "Python 3.9+ is required for kubernetes.core"

- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ monitoring_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Render kube-prometheus values from template
  ansible.builtin.template:
    src: kube-prometheus-values.yaml.j2
    dest: "{{ prometheus_stack_dir }}/kube-prometheus-values.yaml"
    mode: "0644"

- name: Add prometheus-community Helm repo
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "{{ prometheus_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Install kube-prometheus-stack via Helm
  kubernetes.core.helm:
    name: "{{ prometheus_release_name }}"
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: false
    values_files:
      - "{{ prometheus_stack_dir }}/kube-prometheus-values.yaml"
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 10m
    state: present

- name: Discover Grafana service name
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - svc
      - -n
      - "{{ monitoring_namespace }}"
      - -l
      - "app.kubernetes.io/name=grafana"
      - -o
      - "jsonpath={.items[0].metadata.name}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: grafana_svc_discovery
  changed_when: false
  failed_when: grafana_svc_discovery.rc != 0 or grafana_svc_discovery.stdout == ''

- name: Set grafana_service_name from discovered service
  ansible.builtin.set_fact:
    grafana_service_name: "service/{{ grafana_svc_discovery.stdout }}"

- name: Stop existing Grafana port-forward process
  ansible.builtin.shell: |
    pkill -f "[k]ubectl port-forward.*{{ grafana_port_forward_local_port }}:{{ grafana_port_forward_remote_port }}" || true
  changed_when: false
  when: port_forward_enabled | bool

- name: Wait for Grafana port-forward port to be released
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if port_forward_address == '0.0.0.0' else port_forward_address }}"
    port: "{{ grafana_port_forward_local_port }}"
    state: stopped
    timeout: 10
  when: port_forward_enabled | bool

- name: Setup Grafana port-forwarding
  ansible.builtin.command:
    argv:
      - kubectl
      - port-forward
      - --address
      - "{{ port_forward_address }}"
      - "{{ grafana_service_name }}"
      - -n
      - "{{ monitoring_namespace }}"
      - "{{ grafana_port_forward_local_port }}:{{ grafana_port_forward_remote_port }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  async: 3600
  poll: 0
  register: port_forward_job
  when: port_forward_enabled | bool

- name: Check Grafana port-forward job status
  ansible.builtin.async_status:
    jid: "{{ port_forward_job.ansible_job_id }}"
  register: job_result
  until: job_result.finished or (job_result.started is defined and job_result.started == 1)
  retries: 5
  delay: 1
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
  failed_when: job_result.finished and job_result.rc != 0

- name: Verify Grafana port-forward local port is accepting connections
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if port_forward_address == '0.0.0.0' else port_forward_address }}"
    port: "{{ grafana_port_forward_local_port }}"
    timeout: 10
  when: port_forward_enabled | bool

- name: Display Grafana port-forward job info
  ansible.builtin.debug:
    msg:
      status: "Port-forwarding started and validated"
      job_id: "{{ port_forward_job.ansible_job_id }}"
      admin_user: "admin"
      admin_password: "{{ grafana_admin_password }}"
      access_url: "http://{{ k3s_master_public_ip }}:{{ grafana_port_forward_local_port }}"
      remote_service: "{{ grafana_service_name }}:{{ grafana_port_forward_remote_port }}"
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
