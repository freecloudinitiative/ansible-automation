---
- name: Validate harbor_admin_password is set
  ansible.builtin.assert:
    that:
      - harbor_admin_password is string
      - (harbor_admin_password | trim | length) > 0
    fail_msg: "harbor_admin_password must be a non-empty string."

- name: Add Harbor Helm repo
  kubernetes.core.helm_repository:
    name: harbor
    repo_url: "{{ harbor_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Ensure Harbor namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ harbor_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Install Harbor via Helm
  kubernetes.core.helm:
    name: "{{ harbor_release_name }}"
    chart_ref: harbor/harbor
    release_namespace: "{{ harbor_namespace }}"
    create_namespace: false
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 10m
    state: present
    values:
      expose:
        type: "{{ harbor_expose_type }}"
        ingress:
          hosts:
            core: harbor.local
      externalURL: "{{ harbor_external_url }}"
      harborAdminPassword: "{{ harbor_admin_password }}"
      nodeSelector:
        node-tier: "{{ harbor_node_tier }}"
      portal:
        image:
          tag: "{{ harbor_version }}"
      core:
        image:
          tag: "{{ harbor_version }}"
      jobservice:
        image:
          tag: "{{ harbor_version }}"
      registry:
        registry:
          tag: "{{ harbor_version }}"
        controller:
          tag: "{{ harbor_version }}"
      trivy:
        image:
          tag: "{{ harbor_version }}"
      database:
        internal:
          image:
            tag: "{{ harbor_version }}"
      redis:
        internal:
          image:
            tag: "{{ harbor_version }}"

- name: Wait for Harbor core deployment to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=Available
      - deployment/harbor-core
      - -n
      - "{{ harbor_namespace }}"
      - --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Get Harbor pods
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - -n
      - "{{ harbor_namespace }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: harbor_pods
  changed_when: false

- name: Display Harbor pods info
  ansible.builtin.debug:
    msg: "{{ harbor_pods.stdout_lines }}"

- name: Setup Harbor port-forwarding
  ansible.builtin.command:
    argv:
      - kubectl
      - port-forward
      - --address
      - "{{ port_forward_address }}"
      - "{{ harbor_service_name }}"
      - -n
      - "{{ harbor_namespace }}"
      - "{{ harbor_port_forward_local_port }}:{{ harbor_port_forward_remote_port }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  async: 3600
  poll: 0
  register: port_forward_job
  when: port_forward_enabled | bool

- name: Check Harbor port-forward job status
  ansible.builtin.async_status:
    jid: "{{ port_forward_job.ansible_job_id }}"
  register: job_result
  until: job_result.finished or (job_result.started is defined and job_result.started == 1)
  retries: 5
  delay: 1
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
  failed_when: job_result.finished and job_result.rc != 0

- name: Verify Harbor port-forward local port is accepting connections
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if port_forward_address == '0.0.0.0' else port_forward_address }}"
    port: "{{ harbor_port_forward_local_port }}"
    timeout: 10
  when: port_forward_enabled | bool

- name: Display Harbor port-forward job info
  ansible.builtin.debug:
    msg:
      status: "Port-forwarding started and validated"
      job_id: "{{ port_forward_job.ansible_job_id }}"
      admin_user: "admin"
      admin_password: "{{ harbor_admin_password }}"
      access_url: "http://{{ k3s_master_public_ip }}:{{ harbor_port_forward_local_port }}"
      remote_service: "{{ harbor_service_name }}:{{ harbor_port_forward_remote_port }}"
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
