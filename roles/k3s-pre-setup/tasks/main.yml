---
- name: Disable swap
  ansible.builtin.command:
    argv:
      - swapoff
      - -a

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^\s*(\S+)\s+\S+\s+swap\s+.*$'
    replace: '# \g<0>'

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Disable dphys-swapfile service
  ansible.builtin.service:
    name: dphys-swapfile
    enabled: false
    state: stopped
  when: "'dphys-swapfile.service' in ansible_facts.services or 'dphys-swapfile' in ansible_facts.services"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name: "{{ k3s_presetup_packages }}"
    state: present

- name: Ensure containerd service is enabled and started
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Ensure python3-pip is installed
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-jsonpatch
      - python3-yaml
    state: present
    update_cache: true
  become: true
  ignore_errors: true

- name: Upgrade kubernetes Python library to >= 24.2.0
  ansible.builtin.pip:
    name:
      - "kubernetes>=24.2.0"
      - "jsonpatch"
      - "PyYAML"
    state: present
    extra_args: "--break-system-packages --ignore-installed"
  become: true
  ignore_errors: true
