---
# ============================================================================
# Disable Swap
# ============================================================================

- name: Disable swap
  ansible.builtin.command:
    argv:
      - swapoff
      - -a

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^\s*(\S+)\s+\S+\s+swap\s+.*$'
    replace: '# \g<0>'

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Disable dphys-swapfile service
  ansible.builtin.service:
    name: dphys-swapfile
    enabled: false
    state: stopped
  when: "'dphys-swapfile.service' in ansible_facts.services or 'dphys-swapfile' in ansible_facts.services"

# ============================================================================
# Install Requirements
# ============================================================================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name: "{{ k3s_presetup_packages }}"
    state: present

- name: Ensure containerd service is enabled and started
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Install nerdctl CLI
  block:
    - name: Set nerdctl architecture fact
      ansible.builtin.set_fact:
        nerdctl_arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"

    - name: Download and unarchive nerdctl binary
      ansible.builtin.unarchive:
        src: "https://github.com/containerd/nerdctl/releases/download/v{{ nerdctl_version }}/nerdctl-{{ nerdctl_version }}-linux-{{ nerdctl_arch }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        mode: '0755'
        creates: /usr/local/bin/nerdctl

    - name: Ensure nerdctl configuration directory exists
      ansible.builtin.file:
        path: /etc/nerdctl
        state: directory
        mode: '0755'

    - name: Configure nerdctl to use K3s containerd socket by default
      ansible.builtin.copy:
        dest: /etc/nerdctl/nerdctl.toml
        content: |
          address = "unix:///run/k3s/containerd/containerd.sock"
          namespace = "k8s.io"
        mode: '0644'

- name: Ensure python3-pip is installed
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-jsonpatch
      - python3-yaml
    state: present
    update_cache: true
  become: true
  ignore_errors: true

- name: Upgrade kubernetes Python library to >= 24.2.0
  ansible.builtin.pip:
    name:
      - "kubernetes>=24.2.0"
      - "jsonpatch"
      - "PyYAML"
    state: present
    extra_args: "--break-system-packages --ignore-installed"
  become: true
  ignore_errors: true
