---
# ---------------------------------------------------------------------------
# Memory cgroup enablement — must run before k3s install
# ---------------------------------------------------------------------------
- name: Locate the boot cmdline file
  ansible.builtin.stat:
    path: "{{ item }}"
  register: cmdline_stat
  loop:
    - /boot/firmware/cmdline.txt
    - /boot/cmdline.txt

- name: Select the boot cmdline path
  ansible.builtin.set_fact:
    cmdline_path: "{{ (cmdline_stat.results | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('', true) }}"

- name: Read the available cgroup controllers
  ansible.builtin.command: cat /proc/cgroups
  register: proc_cgroups_before
  changed_when: false

- name: Record whether the memory controller is already enabled
  ansible.builtin.set_fact:
    memory_cgroup_enabled: "{{ proc_cgroups_before.stdout is search('^memory\\s+\\d+\\s+\\d+\\s+1', multiline=True) }}"

- name: Ensure cgroup_memory=1 on the kernel command line
  ansible.builtin.replace:
    path: "{{ cmdline_path }}"
    regexp: '^(?!.*\bcgroup_memory=1\b)(.+?)\s*$'
    replace: '\1 cgroup_memory=1'
  when:
    - not memory_cgroup_enabled
    - cmdline_path | length > 0
  register: cmdline_memory

- name: Ensure cgroup_enable=memory on the kernel command line
  ansible.builtin.replace:
    path: "{{ cmdline_path }}"
    regexp: '^(?!.*\bcgroup_enable=memory\b)(.+?)\s*$'
    replace: '\1 cgroup_enable=memory'
  when:
    - not memory_cgroup_enabled
    - cmdline_path | length > 0
  register: cmdline_enable

- name: Reboot to apply the cgroup kernel parameters
  ansible.builtin.reboot:
    msg: "Rebooting to enable memory cgroups"
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  when: cmdline_memory.changed or cmdline_enable.changed

- name: Re-read the available cgroup controllers
  ansible.builtin.command: cat /proc/cgroups
  register: proc_cgroups_after
  changed_when: false

- name: Fail when the memory cgroup controller is unavailable
  ansible.builtin.assert:
    that:
      - proc_cgroups_after.stdout is search('^memory\s+\d+\s+\d+\s+1', multiline=True)
    fail_msg: >-
      Memory cgroup controller is not enabled on {{ inventory_hostname }}.
      k3s cannot enforce ResourceQuota, LimitRange, or per-engine memory limits.
      Checked {{ cmdline_path | default('no cmdline.txt found') }}.

# ---------------------------------------------------------------------------
# Swap disablement
# ---------------------------------------------------------------------------
- name: Disable swap
  ansible.builtin.command:
    argv:
      - swapoff
      - -a

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^\s*(\S+)\s+\S+\s+swap\s+.*$'
    replace: '# \g<0>'

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Disable dphys-swapfile service
  ansible.builtin.service:
    name: dphys-swapfile
    enabled: false
    state: stopped
  when: "'dphys-swapfile.service' in ansible_facts.services or 'dphys-swapfile' in ansible_facts.services"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name: "{{ k3s_presetup_packages }}"
    state: present

- name: Ensure containerd service is enabled and started
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Ensure python3-pip is installed
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-jsonpatch
      - python3-yaml
    state: present
    update_cache: true
  become: true
  ignore_errors: true

- name: Upgrade kubernetes Python library to >= 24.2.0
  ansible.builtin.pip:
    name:
      - "kubernetes>=24.2.0"
      - "jsonpatch"
      - "PyYAML"
    state: present
    extra_args: "--break-system-packages --ignore-installed"
  become: true
  ignore_errors: true
