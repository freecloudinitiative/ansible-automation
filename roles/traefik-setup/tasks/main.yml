---
- name: Create Traefik stack directory
  ansible.builtin.file:
    path: "{{ traefik_stack_dir }}"
    state: directory
    mode: "0755"

- name: Add Traefik Helm repo
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: "{{ traefik_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Ensure Traefik namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ traefik_namespace }}"
    state: present
    kubeconfig: "{{ traefik_kubeconfig }}"

- name: Render Traefik values from template
  ansible.builtin.template:
    src: traefik-values.yaml.j2
    dest: "{{ traefik_stack_dir }}/traefik-values.yaml"
    mode: "0644"

- name: Install Traefik via Helm
  kubernetes.core.helm:
    name: "{{ traefik_release_name }}"
    chart_ref: traefik/traefik
    chart_version: "{{ traefik_chart_version }}"
    release_namespace: "{{ traefik_namespace }}"
    create_namespace: false
    values_files:
      - "{{ traefik_stack_dir }}/traefik-values.yaml"
    kubeconfig: "{{ traefik_kubeconfig }}"
    wait: true
    wait_timeout: 5m
    state: present

- name: Wait for Traefik deployment to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=Available
      - "deployment/{{ traefik_release_name }}"
      - -n
      - "{{ traefik_namespace }}"
      - --timeout=120s
  environment:
    KUBECONFIG: "{{ traefik_kubeconfig }}"
  changed_when: false

- name: Get Traefik pods
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - -n
      - "{{ traefik_namespace }}"
  environment:
    KUBECONFIG: "{{ traefik_kubeconfig }}"
  register: traefik_pods
  changed_when: false

- name: Display Traefik pods info
  ansible.builtin.debug:
    msg: "{{ traefik_pods.stdout_lines }}"
