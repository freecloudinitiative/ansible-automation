---
- name: Create Traefik stack directory
  ansible.builtin.file:
    path: "{{ traefik_stack_dir }}"
    state: directory
    mode: "0755"

- name: Add Traefik Helm repo
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: "{{ traefik_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Ensure Traefik namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ traefik_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Render Traefik values from template
  ansible.builtin.template:
    src: traefik-values.yaml.j2
    dest: "{{ traefik_stack_dir }}/traefik-values.yaml"
    mode: "0644"

- name: Install Traefik via Helm
  kubernetes.core.helm:
    name: "{{ traefik_release_name }}"
    chart_ref: traefik/traefik
    chart_version: "{{ traefik_chart_version }}"
    release_namespace: "{{ traefik_namespace }}"
    create_namespace: false
    values_files:
      - "{{ traefik_stack_dir }}/traefik-values.yaml"
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 5m
    state: present

- name: Wait for Traefik deployment to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=Available
      - "deployment/{{ traefik_release_name }}"
      - -n
      - "{{ traefik_namespace }}"
      - --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Get Traefik pods
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - -n
      - "{{ traefik_namespace }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: traefik_pods
  changed_when: false

- name: Display Traefik pods info
  ansible.builtin.debug:
    msg: "{{ traefik_pods.stdout_lines }}"

- name: Stop existing Traefik port-forward process
  ansible.builtin.shell: |
    pkill -f "[k]ubectl port-forward.*{{ traefik_port_forward_local_port }}:{{ traefik_port_forward_remote_port }}" || true
  changed_when: false
  when: port_forward_enabled | bool

- name: Wait for Traefik port-forward port to be released
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if port_forward_address == '0.0.0.0' else port_forward_address }}"
    port: "{{ traefik_port_forward_local_port }}"
    state: stopped
    timeout: 10
  when: port_forward_enabled | bool

- name: Setup Traefik port-forwarding
  ansible.builtin.command:
    argv:
      - kubectl
      - port-forward
      - --address
      - "{{ port_forward_address }}"
      - "svc/{{ traefik_release_name }}"
      - -n
      - "{{ traefik_namespace }}"
      - "{{ traefik_port_forward_local_port }}:{{ traefik_port_forward_remote_port }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  async: 3600
  poll: 0
  register: port_forward_job
  when: port_forward_enabled | bool

- name: Check Traefik port-forward job status
  ansible.builtin.async_status:
    jid: "{{ port_forward_job.ansible_job_id }}"
  register: job_result
  until: job_result.finished or (job_result.started is defined and job_result.started == 1)
  retries: 5
  delay: 1
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
  failed_when: job_result.finished and job_result.rc != 0

- name: Verify Traefik port-forward local port is accepting connections
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if port_forward_address == '0.0.0.0' else port_forward_address }}"
    port: "{{ traefik_port_forward_local_port }}"
    timeout: 10
  when: port_forward_enabled | bool

- name: Display Traefik port-forward job info
  ansible.builtin.debug:
    msg:
      status: "Port-forwarding started and validated"
      job_id: "{{ port_forward_job.ansible_job_id }}"
      access_url: "http://{{ k3s_master_public_ip | default(ansible_host | default(k3s_master_ip | default(ansible_facts['default_ipv4']['address']))) }}:{{ traefik_port_forward_local_port }}/dashboard/"
      remote_service: "svc/{{ traefik_release_name }}:{{ traefik_port_forward_remote_port }}"
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
