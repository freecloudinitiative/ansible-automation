---
# ---------------------------------------------------------------------------
# Inventory validation
# Runs as the first role in play 1 (hosts: all) before any node is modified.
# ---------------------------------------------------------------------------

# k3s_master1_public_ip may be left unset/blank on purpose: k3s-master-setup
# resolves it from master-1's own LAN address (ansible_facts.default_ipv4)
# during the masters play, which runs after this one. What can't be blank is
# a value that IS set but is whitespace-only -- that still produces
# --server=https://:6443 and breaks worker/secondary-master join after k3s
# is already installed on the primaries, same failure mode the auto-resolve
# path is designed to avoid.
- name: Validate required inventory variables
  ansible.builtin.assert:
    that:
      - k3s_master1_public_ip is not defined or (k3s_master1_public_ip | trim | length > 0) or (k3s_master1_public_ip | length == 0)
      - groups['masters'] | default([]) | length > 0
      - groups['workers'] | default([]) | length > 0
    fail_msg: >-
      k3s_master1_public_ip is set but whitespace-only -- leave it fully
      empty ("") to auto-resolve master-1's LAN address instead, or set it
      to a real address. Define non-empty masters and workers groups in
      inventory.ini. Validation stops the play before any node is modified.
  run_once: true
  delegate_to: localhost
  become: false
