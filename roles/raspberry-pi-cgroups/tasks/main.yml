---
# ---------------------------------------------------------------------------
# Memory cgroup verification
# Runs before k3s install (play 1, hosts: all).
# cmdline.txt's cgroup_enable=memory/cgroup_memory=1 params are set at
# imaging time (Raspberry Pi Imager advanced options), not by this role --
# this just verifies the running kernel actually picked them up. A node
# whose cmdline.txt was edited but never rebooted since fails here with a
# clear pointer, instead of the ResourceQuota/LimitRange failures that would
# otherwise surface much later, deep into the k3s install.
# ---------------------------------------------------------------------------

- name: Read the available cgroup controllers
  ansible.builtin.command: cat /proc/cgroups
  register: proc_cgroups
  changed_when: false

- name: Fail when the memory cgroup controller is unavailable
  ansible.builtin.assert:
    that:
      - proc_cgroups.stdout is search(rpi_cgroups_proc_pattern, multiline=True)
    fail_msg: >-
      Memory cgroup controller is not enabled on {{ inventory_hostname }}.
      k3s cannot enforce ResourceQuota, LimitRange, or per-engine memory
      limits. cmdline.txt's cgroup params are set at imaging time, not by
      this role -- if they're present but the controller still isn't active,
      reboot the node.
