---
# Official static release. 4.x ships kata-static (runtime-rs) and kata-go-static.
kata_version: "4.1.0"
kata_release_artifact: kata-static

kata_install_root: /opt/kata
kata_config_dir: /etc/kata-containers
kata_download_dir: /var/tmp
kata_cleanup_tarball: true

kata_shim_name: containerd-shim-kata-v2
kata_runtime_bin: kata-runtime
kata_runtime_handler: kata

# Packaged QEMU config. Copied to /etc/kata-containers so host edits survive upgrades.
kata_source_config: "{{ kata_install_root }}/share/defaults/kata-containers/configuration-qemu.toml"
kata_config_path: "{{ kata_config_dir }}/configuration.toml"

kata_shim_path: "{{ kata_install_root }}/bin/{{ kata_shim_name }}"
kata_runtime_path: "{{ kata_install_root }}/bin/{{ kata_runtime_bin }}"

kata_containerd_dir: /var/lib/rancher/k3s/agent/etc/containerd
kata_containerd_v3_tmpl: "{{ kata_containerd_dir }}/config-v3.toml.tmpl"
kata_containerd_v2_tmpl: "{{ kata_containerd_dir }}/config.toml.tmpl"

kata_packages:
  - zstd
  - curl
  - ca-certificates

# Guest VM boot memory (MiB). Per-pod overhead on high_memory workers.
kata_default_memory_mb: 2048
kata_default_vcpus: 1

kata_require_kvm: true
kata_apply_runtimeclass: true

# The next three values are a contract with compute-service, not free choices.
# Its instancetype.Checker refuses to offer the dedicated instance type unless
# it finds BOTH a RuntimeClass by this exact name AND at least one Ready node
# carrying this exact label, and its projection pins dedicated pods to that
# same label. Getting either wrong does not fail loudly: the dedicated type
# simply never appears in the API, with nothing in any log to say why.
#
#   compute-service/internal/instancetype/types.go       kataRuntimeClass
#   compute-service/internal/instancetype/capability.go  kataNodeSelector
#   compute-service/internal/projection/project.go       kataNodeLabel
#
# The RuntimeClass *name* is separate from kata_runtime_handler above, which
# names the containerd runtime section this class dispatches to and stays
# "kata" to match what this role writes into containerd's config.
kata_runtimeclass_name: kata-qemu

# Matches k3s-node-labeling: only high_memory workers get Kata.
kata_runtimeclass_node_selector:
  node-tier: high-memory

kata_node_label_key: fci.io/runtime
kata_node_label_value: kata

kubeconfig_path: /etc/rancher/k3s/k3s.yaml
