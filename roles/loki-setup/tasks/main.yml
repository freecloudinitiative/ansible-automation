---
- name: Create Loki stack directory
  ansible.builtin.file:
    path: "{{ loki_stack_dir }}"
    state: directory
    mode: "0755"

- name: Add Grafana Helm repo
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "{{ loki_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ monitoring_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Render Loki values from template
  ansible.builtin.template:
    src: loki-values.yaml.j2
    dest: "{{ loki_stack_dir }}/loki-values.yaml"
    mode: "0644"

- name: Install Loki via Helm
  kubernetes.core.helm:
    name: "{{ loki_release_name }}"
    chart_ref: grafana/loki
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: false
    values_files:
      - "{{ loki_stack_dir }}/loki-values.yaml"
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 10m
    state: present

- name: Discover Loki service name
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - svc
      - -n
      - "{{ monitoring_namespace }}"
      - -l
      - "app.kubernetes.io/instance={{ loki_release_name }}"
      - -o
      - "jsonpath={.items[0].metadata.name}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: loki_svc_discovery
  changed_when: false
  failed_when: loki_svc_discovery.rc != 0 or loki_svc_discovery.stdout == ''

- name: Set loki_service_name from discovered service
  ansible.builtin.set_fact:
    loki_service_name: "service/{{ loki_svc_discovery.stdout }}"

- name: Setup Loki port-forwarding
  ansible.builtin.command:
    argv:
      - kubectl
      - port-forward
      - --address
      - "{{ port_forward_address }}"
      - "{{ loki_service_name }}"
      - -n
      - "{{ monitoring_namespace }}"
      - "{{ loki_port_forward_local_port }}:{{ loki_port_forward_remote_port }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  async: 3600
  poll: 0
  register: port_forward_job
  when: port_forward_enabled | bool

- name: Check Loki port-forward job status
  ansible.builtin.async_status:
    jid: "{{ port_forward_job.ansible_job_id }}"
  register: job_result
  until: job_result.finished or (job_result.started is defined and job_result.started == 1)
  retries: 5
  delay: 1
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
  failed_when: job_result.finished and job_result.rc != 0

- name: Verify Loki port-forward local port is accepting connections
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if port_forward_address == '0.0.0.0' else port_forward_address }}"
    port: "{{ loki_port_forward_local_port }}"
    timeout: 10
  when: port_forward_enabled | bool

- name: Display Loki port-forward job info
  ansible.builtin.debug:
    msg:
      status: "Port-forwarding started and validated"
      job_id: "{{ port_forward_job.ansible_job_id }}"
      access_url: "http://{{ k3s_master1_public_ip }}:{{ loki_port_forward_local_port }}"
      remote_service: "{{ loki_service_name }}:{{ loki_port_forward_remote_port }}"
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
