---
- name: Create Loki stack directory
  ansible.builtin.file:
    path: "{{ loki_stack_dir }}"
    state: directory
    mode: "0755"

- name: Add Grafana Helm repo
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "{{ loki_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Render Loki values from template
  ansible.builtin.template:
    src: loki-values.yaml.j2
    dest: "{{ loki_stack_dir }}/loki-values.yaml"
    mode: "0644"

- name: Install Loki via Helm
  kubernetes.core.helm:
    name: "{{ loki_release_name }}"
    chart_ref: grafana/loki
    release_namespace: "{{ prometheus_namespace }}"
    create_namespace: true
    values_files:
      - "{{ loki_stack_dir }}/loki-values.yaml"
    kubeconfig: "{{ loki_kubeconfig }}"
    state: present

- name: Setup Loki port-forwarding
  ansible.builtin.command:
    argv:
      - kubectl
      - port-forward
      - --address
      - "{{ loki_port_forward_address }}"
      - "{{ loki_service_name }}"
      - -n
      - "{{ prometheus_namespace }}"
      - "{{ loki_port_forward_local_port }}:{{ loki_port_forward_remote_port }}"
  environment:
    KUBECONFIG: "{{ loki_kubeconfig }}"
  changed_when: false
  async: 3600
  poll: 0
  register: port_forward_job
  when: loki_port_forward_enabled | bool

- name: Display Loki port-forward job info
  ansible.builtin.debug:
    msg:
      status: "Port-forwarding started in background"
      job_id: "{{ port_forward_job.ansible_job_id }}"
      local_port: "{{ loki_port_forward_local_port }}"
      remote_service: "{{ loki_service_name }}:{{ loki_port_forward_remote_port }}"
  when: loki_port_forward_enabled | bool and port_forward_job.ansible_job_id is defined