---
- name: Create Alloy stack directory
  ansible.builtin.file:
    path: "{{ alloy_stack_dir }}"
    state: directory
    mode: "0755"

- name: Add Grafana Helm repo
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "{{ alloy_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Render alloy values from template
  ansible.builtin.template:
    src: alloy-values.yaml.j2
    dest: "{{ alloy_stack_dir }}/alloy-values.yaml"
    mode: "0644"

- name: Install Alloy via Helm
  kubernetes.core.helm:
    name: "{{ alloy_release_name }}"
    chart_ref: grafana/alloy
    release_namespace: "{{ prometheus_namespace }}"
    create_namespace: true
    values_files:
      - "{{ alloy_stack_dir }}/alloy-values.yaml"
    kubeconfig: "{{ alloy_kubeconfig }}"
    state: present

- name: Setup Alloy port-forwarding
  ansible.builtin.command:
    argv:
      - kubectl
      - port-forward
      - --address
      - "{{ alloy_port_forward_address }}"
      - "{{ alloy_service_name }}"
      - -n
      - "{{ prometheus_namespace }}"
      - "{{ alloy_port_forward_local_port }}:{{ alloy_port_forward_remote_port }}"
  environment:
    KUBECONFIG: "{{ alloy_kubeconfig }}"
  changed_when: false
  async: 3600
  poll: 0
  register: port_forward_job
  when: alloy_port_forward_enabled | bool

- name: Display Alloy port-forward job info
  ansible.builtin.debug:
    msg:
      status: "Port-forwarding started in background"
      job_id: "{{ port_forward_job.ansible_job_id }}"
      local_port: "{{ alloy_port_forward_local_port }}"
      remote_service: "{{ alloy_service_name }}:{{ alloy_port_forward_remote_port }}"
  when: alloy_port_forward_enabled | bool and port_forward_job.ansible_job_id is defined