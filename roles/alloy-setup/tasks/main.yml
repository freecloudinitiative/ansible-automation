---
- name: Create Alloy stack directory
  ansible.builtin.file:
    path: "{{ alloy_stack_dir }}"
    state: directory
    mode: "0755"

- name: Add Grafana Helm repo
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "{{ alloy_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ monitoring_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Render alloy values from template
  ansible.builtin.template:
    src: alloy-values.yaml.j2
    dest: "{{ alloy_stack_dir }}/alloy-values.yaml"
    mode: "0644"

- name: Install Alloy via Helm
  kubernetes.core.helm:
    name: "{{ alloy_release_name }}"
    chart_ref: grafana/alloy
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: false
    values_files:
      - "{{ alloy_stack_dir }}/alloy-values.yaml"
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 15m
    state: present

- name: Wait for Alloy DaemonSet rollout
  ansible.builtin.command:
    argv:
      - kubectl
      - rollout
      - status
      - "daemonset/{{ alloy_release_name }}"
      - -n
      - "{{ monitoring_namespace }}"
      - --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Discover Alloy service name
  ansible.builtin.shell: |
    SVC=$(kubectl get svc -n "{{ monitoring_namespace }}" -l "app.kubernetes.io/name=alloy,app.kubernetes.io/instance={{ alloy_release_name }}" -o "jsonpath={.items[0].metadata.name}" --kubeconfig "{{ kubeconfig_path }}" 2>/dev/null)
    if [ -n "$SVC" ]; then
      echo "service/$SVC"
    else
      echo "daemonset/{{ alloy_release_name }}"
    fi
  register: alloy_svc_discovery
  changed_when: false

- name: Set alloy_service_name from discovered service
  ansible.builtin.set_fact:
    alloy_service_name: "{{ alloy_svc_discovery.stdout | trim }}"

- name: Setup Alloy port-forwarding
  ansible.builtin.command:
    argv:
      - kubectl
      - port-forward
      - --address
      - "{{ port_forward_address }}"
      - "{{ alloy_service_name }}"
      - -n
      - "{{ monitoring_namespace }}"
      - "{{ alloy_port_forward_local_port }}:{{ alloy_port_forward_remote_port }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  async: 3600
  poll: 0
  register: port_forward_job
  when: port_forward_enabled | bool

- name: Check Alloy port-forward job status
  ansible.builtin.async_status:
    jid: "{{ port_forward_job.ansible_job_id }}"
  register: job_result
  until: job_result.finished or (job_result.started is defined and job_result.started == 1)
  retries: 5
  delay: 1
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
  failed_when: job_result.finished and job_result.rc != 0

- name: Verify Alloy port-forward local port is accepting connections
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if port_forward_address == '0.0.0.0' else port_forward_address }}"
    port: "{{ alloy_port_forward_local_port }}"
    timeout: 10
  when: port_forward_enabled | bool

- name: Display Alloy port-forward job info
  ansible.builtin.debug:
    msg:
      status: "Port-forwarding started and validated"
      job_id: "{{ port_forward_job.ansible_job_id }}"
      access_url: "http://{{ k3s_master1_public_ip }}:{{ alloy_port_forward_local_port }}"
      remote_service: "{{ alloy_service_name }}:{{ alloy_port_forward_remote_port }}"
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
