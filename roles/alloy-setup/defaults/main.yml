---
monitoring_namespace: monitoring
alloy_stack_dir: "{{ '~/k3s-stack/monitoring' | expanduser }}"
alloy_release_name: alloy
alloy_helm_repo_url: https://grafana.github.io/helm-charts
kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"

port_forward_enabled: true
port_forward_address: "0.0.0.0"
alloy_port_forward_local_port: 12345
alloy_port_forward_remote_port: 12345
