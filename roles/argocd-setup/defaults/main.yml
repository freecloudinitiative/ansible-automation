---
argocd_version: "v3.5.1"
argocd_namespace: argocd
argocd_manifest_url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"

argocd_node_selector:
  node-tier: high-memory

argocd_deployments:
  - name: argocd-server
    kind: Deployment
    container_name: argocd-server
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  - name: argocd-repo-server
    kind: Deployment
    container_name: argocd-repo-server
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  - name: argocd-application-controller
    kind: StatefulSet
    container_name: argocd-application-controller
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
  - name: argocd-dex-server
    kind: Deployment
    container_name: dex
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  - name: argocd-redis
    kind: Deployment
    container_name: redis
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  - name: argocd-notifications-controller
    kind: Deployment
    container_name: argocd-notifications-controller
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  - name: argocd-applicationset-controller
    kind: Deployment
    container_name: argocd-applicationset-controller
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
argocd_admin_password: ""
