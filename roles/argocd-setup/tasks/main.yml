---
- name: Download and install ArgoCD CLI binary
  ansible.builtin.get_url:
    url: >-
      https://github.com/argoproj/argo-cd/releases/download/{{ argocd_version }}/argocd-linux-{{
      'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}
    dest: /usr/local/bin/argocd
    mode: '0755'

- name: Ensure argocd namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ argocd_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"

- name: Ensure ~/k3s-stack/argocd directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/k3s-stack/argocd"
    state: directory
    mode: '0755'

- name: Download ArgoCD manifest
  ansible.builtin.get_url:
    url: "{{ argocd_manifest_url }}"
    dest: "{{ ansible_facts.env.HOME }}/k3s-stack/argocd/install.yaml"
    mode: '0644'

- name: Install ArgoCD from manifest
  kubernetes.core.k8s:
    state: present
    namespace: "{{ argocd_namespace }}"
    src: "{{ ansible_facts.env.HOME }}/k3s-stack/argocd/install.yaml"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"

- name: Patch ArgoCD deployments with nodeSelector and resources
  kubernetes.core.k8s:
    state: patched
    kind: "{{ item.kind }}"
    namespace: "{{ argocd_namespace }}"
    name: "{{ item.name }}"
    definition:
      spec:
        template:
          spec:
            nodeSelector: "{{ argocd_node_selector }}"
            containers:
              - name: "{{ item.container_name }}"
                resources: "{{ item.resources }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  loop: "{{ argocd_deployments }}"

- name: Configure argocd-cmd-params-cm ConfigMap for path routing
  kubernetes.core.k8s:
    state: present
    namespace: "{{ argocd_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
        namespace: "{{ argocd_namespace }}"
      data:
        server.insecure: "false"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  notify: Restart argocd-server

- name: Configure argocd-cm ExternalSecret health check before root-app sync starts
  kubernetes.core.k8s:
    state: present
    namespace: "{{ argocd_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
        namespace: "{{ argocd_namespace }}"
        labels:
          app.kubernetes.io/name: argocd-cm
          app.kubernetes.io/part-of: argocd
      data:
        # Without this, ArgoCD has no health check for ExternalSecret and
        # treats it Healthy the instant the CR is admitted, before the
        # External Secrets Operator controller has actually read OpenBao
        # and materialized the real Secret. Every later sync-wave's pod
        # that mounts one of those Secrets then races the reconcile and
        # fails its first schedule with "secret not found" (observed
        # across authentik, cloudflared, grafana, terminal-gateway on a
        # fresh cluster). This must land before argocd-bootstrap creates
        # root-app, or the very first sync still races — the same
        # customization is also kept in k3s-manifests'
        # infrastructure/argocd/argocd-cm.yaml so later GitOps syncs don't
        # revert it.
        resource.customizations.health.external-secrets.io_ExternalSecret: |
          hs = {}
          if obj.status ~= nil and obj.status.conditions ~= nil then
            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "Ready" and condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.message
                return hs
              end
              if condition.type == "Ready" and condition.status == "False" then
                hs.status = "Degraded"
                hs.message = condition.message
                return hs
              end
            end
          end
          hs.status = "Progressing"
          hs.message = "Waiting for ExternalSecret to sync"
          return hs
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  notify: Restart argocd-server

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for ArgoCD deployments to be ready
  kubernetes.core.k8s_info:
    kind: "{{ item.kind }}"
    namespace: "{{ argocd_namespace }}"
    name: "{{ item.name }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  register: argocd_deployment_status
  until:
    - argocd_deployment_status.resources is defined
    - argocd_deployment_status.resources | length > 0
    - (argocd_deployment_status.resources[0].status.readyReplicas | default(0)) > 0
    - (argocd_deployment_status.resources[0].status.readyReplicas | default(0)) == (argocd_deployment_status.resources[0].spec.replicas | default(1))
  retries: 60
  delay: 10
  loop: "{{ argocd_deployments }}"

- name: Get ArgoCD initial admin secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: argocd-initial-admin-secret
    namespace: "{{ argocd_namespace }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  register: argocd_secret
  retries: 10
  delay: 5
  until:
    - argocd_secret.resources is defined
    - argocd_secret.resources | length > 0
  ignore_errors: true

- name: Set ArgoCD admin password fact
  ansible.builtin.set_fact:
    argocd_admin_password: "{{ argocd_secret.resources[0].data.password | b64decode }}"
  when:
    - argocd_secret.resources is defined
    - argocd_secret.resources | length > 0
