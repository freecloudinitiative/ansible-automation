---
- name: Download and install ArgoCD CLI binary
  ansible.builtin.get_url:
    url: "https://github.com/argoproj/argo-cd/releases/download/{{ argocd_cli_version }}/argocd-linux-{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}"
    dest: /usr/local/bin/argocd
    mode: '0755'

- name: Ensure argocd namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ argocd_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"

- name: Ensure ~/k3s-stack/argocd directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/k3s-stack/argocd"
    state: directory
    mode: '0755'

- name: Download ArgoCD manifest
  ansible.builtin.get_url:
    url: "{{ argocd_manifest_url }}"
    dest: "{{ ansible_facts.env.HOME }}/k3s-stack/argocd/install.yaml"
    mode: '0644'

- name: Install ArgoCD from manifest
  kubernetes.core.k8s:
    state: present
    namespace: "{{ argocd_namespace }}"
    src: "{{ ansible_facts.env.HOME }}/k3s-stack/argocd/install.yaml"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  register: argocd_install

- name: Patch ArgoCD deployments with nodeSelector
  kubernetes.core.k8s:
    state: patched
    kind: "{{ item.kind }}"
    namespace: "{{ argocd_namespace }}"
    name: "{{ item.name }}"
    definition:
      spec:
        template:
          spec:
            nodeSelector: "{{ argocd_node_selector }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  loop: "{{ argocd_deployments }}"
  register: patch_result

- name: Wait for ArgoCD deployments to be ready
  kubernetes.core.k8s_info:
    kind: "{{ item.kind }}"
    namespace: "{{ argocd_namespace }}"
    name: "{{ item.name }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  register: argocd_deployment_status
  until:
    - argocd_deployment_status.resources is defined
    - argocd_deployment_status.resources | length > 0
    - (argocd_deployment_status.resources[0].status.readyReplicas | default(0)) > 0
    - (argocd_deployment_status.resources[0].status.readyReplicas | default(0)) == (argocd_deployment_status.resources[0].spec.replicas | default(1))
  retries: 60
  delay: 10
  loop: "{{ argocd_deployments }}"

- name: Get ArgoCD initial admin secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: argocd-initial-admin-secret
    namespace: "{{ argocd_namespace }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  register: argocd_secret
  retries: 10
  delay: 5
  until:
    - argocd_secret.resources is defined
    - argocd_secret.resources | length > 0

- name: Decode ArgoCD admin password
  ansible.builtin.set_fact:
    argocd_admin_password: "{{ argocd_secret.resources[0].data.password | b64decode }}"
  when: argocd_secret.resources | length > 0

- name: Stop existing ArgoCD port-forward process
  ansible.builtin.shell: |
    pkill -f "[k]ubectl port-forward.*{{ argocd_port_forward_local_port }}:{{ argocd_port_forward_remote_port }}" || true
  changed_when: false
  when: port_forward_enabled | bool

- name: Wait for ArgoCD port-forward port to be released
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if port_forward_address == '0.0.0.0' else port_forward_address }}"
    port: "{{ argocd_port_forward_local_port }}"
    state: stopped
    timeout: 10
  when: port_forward_enabled | bool

- name: Setup ArgoCD port-forwarding
  ansible.builtin.command:
    argv:
      - kubectl
      - port-forward
      - --address
      - "{{ port_forward_address }}"
      - svc/argocd-server
      - -n
      - "{{ argocd_namespace }}"
      - "{{ argocd_port_forward_local_port }}:{{ argocd_port_forward_remote_port }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  async: 3600
  poll: 0
  register: port_forward_job
  when: port_forward_enabled | bool

- name: Check ArgoCD port-forward job status
  ansible.builtin.async_status:
    jid: "{{ port_forward_job.ansible_job_id }}"
  register: job_result
  until: job_result.finished or (job_result.started is defined and job_result.started == 1)
  retries: 5
  delay: 1
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
  failed_when: job_result.finished and job_result.rc != 0

- name: Verify ArgoCD port-forward local port is accepting connections
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if port_forward_address == '0.0.0.0' else port_forward_address }}"
    port: "{{ argocd_port_forward_local_port }}"
    timeout: 10
  when: port_forward_enabled | bool

- name: Display ArgoCD port-forward job info
  ansible.builtin.debug:
    msg:
      status: "Port-forwarding started and validated"
      job_id: "{{ port_forward_job.ansible_job_id }}"
      admin_user: "admin"
      admin_password: "{{ argocd_admin_password }}"
      access_url: "https://{{ k3s_master_public_ip }}:{{ argocd_port_forward_local_port }}"
      remote_service: "svc/argocd-server:{{ argocd_port_forward_remote_port }}"
  when: port_forward_enabled | bool and port_forward_job.ansible_job_id is defined
