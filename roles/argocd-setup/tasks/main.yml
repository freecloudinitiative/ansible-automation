---
- name: Download and install ArgoCD CLI binary
  ansible.builtin.get_url:
    url: "https://github.com/argoproj/argo-cd/releases/download/{{ argocd_cli_version }}/argocd-linux-{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}"
    dest: /usr/local/bin/argocd
    mode: '0755'

- name: Ensure argocd namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ argocd_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"

- name: Ensure ~/k3s-stack/argocd directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/k3s-stack/argocd"
    state: directory
    mode: '0755'

- name: Download ArgoCD manifest
  ansible.builtin.get_url:
    url: "{{ argocd_manifest_url }}"
    dest: "{{ ansible_facts.env.HOME }}/k3s-stack/argocd/install.yaml"
    mode: '0644'

- name: Install ArgoCD from manifest
  kubernetes.core.k8s:
    state: present
    namespace: "{{ argocd_namespace }}"
    src: "{{ ansible_facts.env.HOME }}/k3s-stack/argocd/install.yaml"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  register: argocd_install

- name: Patch ArgoCD deployments with nodeSelector
  kubernetes.core.k8s:
    state: patched
    kind: "{{ item.kind }}"
    namespace: "{{ argocd_namespace }}"
    name: "{{ item.name }}"
    definition:
      spec:
        template:
          spec:
            nodeSelector: "{{ argocd_node_selector }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  loop: "{{ argocd_deployments }}"
  register: patch_result

- name: Patch argocd-cmd-params-cm ConfigMap for path-based routing & insecure mode
  kubernetes.core.k8s:
    state: present
    namespace: "{{ argocd_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
        namespace: "{{ argocd_namespace }}"
      data:
        server.insecure: "true"
        server.basehref: "/argocd"
        server.rootpath: "/argocd"

- name: Restart argocd-server deployment to apply configuration
  ansible.builtin.command:
    cmd: kubectl rollout restart deployment argocd-server -n {{ argocd_namespace }}
  changed_when: true

- name: Wait for ArgoCD deployments to be ready
  kubernetes.core.k8s_info:
    kind: "{{ item.kind }}"
    namespace: "{{ argocd_namespace }}"
    name: "{{ item.name }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  register: argocd_deployment_status
  until:
    - argocd_deployment_status.resources is defined
    - argocd_deployment_status.resources | length > 0
    - (argocd_deployment_status.resources[0].status.readyReplicas | default(0)) > 0
    - (argocd_deployment_status.resources[0].status.readyReplicas | default(0)) == (argocd_deployment_status.resources[0].spec.replicas | default(1))
  retries: 60
  delay: 10
  loop: "{{ argocd_deployments }}"

- name: Get ArgoCD initial admin secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: argocd-initial-admin-secret
    namespace: "{{ argocd_namespace }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    context: "{{ context if (context | default('') | length > 0) else omit }}"
  register: argocd_secret
  retries: 10
  delay: 5
  until:
    - argocd_secret.resources is defined
    - argocd_secret.resources | length > 0
  ignore_errors: true

- name: Get ArgoCD admin password via kubectl CLI command fallback
  ansible.builtin.shell: >
    kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
  register: argocd_secret_cli
  when: argocd_secret.resources is not defined or argocd_secret.resources | length == 0
  changed_when: false
  ignore_errors: true

- name: Set ArgoCD admin password fact at end of role
  ansible.builtin.set_fact:
    argocd_admin_password: "{{ (argocd_secret.resources[0].data.password | b64decode) if (argocd_secret.resources is defined and argocd_secret.resources | length > 0) else (argocd_secret_cli.stdout | default('')) }}"
