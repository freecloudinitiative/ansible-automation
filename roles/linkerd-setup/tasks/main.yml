---
- name: Create Linkerd stack directory
  ansible.builtin.file:
    path: "{{ linkerd_stack_dir }}"
    state: directory
    mode: "0755"

- name: Create Linkerd namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ linkerd_namespace }}"
    state: present
    kubeconfig: "{{ linkerd_kubeconfig }}"

- name: Add Linkerd Helm repo
  kubernetes.core.helm_repository:
    name: linkerd
    repo_url: "{{ linkerd_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Install Linkerd CRDs via Helm
  kubernetes.core.helm:
    name: linkerd-crds
    chart_ref: linkerd/linkerd-crds
    release_namespace: "{{ linkerd_namespace }}"
    create_namespace: false
    kubeconfig: "{{ linkerd_kubeconfig }}"
    wait: true
    wait_timeout: 3m
    state: present

- name: Render Linkerd cert-manager certificate chain from template
  ansible.builtin.template:
    src: linkerd-certs.yaml.j2
    dest: "{{ linkerd_stack_dir }}/linkerd-certs.yaml"
    mode: "0644"

- name: Apply Linkerd certificate chain
  kubernetes.core.k8s:
    state: present
    src: "{{ linkerd_stack_dir }}/linkerd-certs.yaml"
    kubeconfig: "{{ linkerd_kubeconfig }}"

- name: Wait for Linkerd identity issuer certificate to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - certificate/linkerd-identity-issuer
      - -n
      - "{{ linkerd_namespace }}"
      - --for=condition=Ready
      - --timeout=120s
  environment:
    KUBECONFIG: "{{ linkerd_kubeconfig }}"
  changed_when: false

- name: Render Linkerd control plane values from template
  ansible.builtin.template:
    src: linkerd-values.yaml.j2
    dest: "{{ linkerd_stack_dir }}/linkerd-values.yaml"
    mode: "0644"

- name: Install Linkerd control plane via Helm
  kubernetes.core.helm:
    name: "{{ linkerd_release_name }}"
    chart_ref: linkerd/linkerd-control-plane
    release_namespace: "{{ linkerd_namespace }}"
    create_namespace: false
    values_files:
      - "{{ linkerd_stack_dir }}/linkerd-values.yaml"
    kubeconfig: "{{ linkerd_kubeconfig }}"
    wait: true
    wait_timeout: 5m
    state: present

- name: Verify Linkerd control plane is healthy
  ansible.builtin.command:
    argv:
      - kubectl
      - rollout
      - status
      - deployment
      - -n
      - "{{ linkerd_namespace }}"
      - --timeout=120s
  environment:
    KUBECONFIG: "{{ linkerd_kubeconfig }}"
  changed_when: false

- name: Install Linkerd Viz via Helm
  kubernetes.core.helm:
    name: "{{ linkerd_viz_release_name }}"
    chart_ref: linkerd/linkerd-viz
    release_namespace: linkerd-viz
    create_namespace: true
    kubeconfig: "{{ linkerd_kubeconfig }}"
    wait: true
    wait_timeout: 5m
    state: present
  when: linkerd_viz_enabled | bool

- name: Display Linkerd setup info
  ansible.builtin.debug:
    msg:
      status: "Linkerd service mesh installed"
      namespace: "{{ linkerd_namespace }}"
      cert_issuer: "{{ linkerd_cert_manager_cluster_issuer }}"
      viz_enabled: "{{ linkerd_viz_enabled }}"
      note: >-
        Label namespaces with 'linkerd.io/inject=enabled' to enable mTLS proxy injection.
        Example: kubectl label namespace monitoring linkerd.io/inject=enabled
