---
- name: Validate ssh_config_cloud
  ansible.builtin.assert:
    that:
      - ssh_config_cloud | default('') in (ssh_config_clouds | default(['gcp', 'aws', 'local']))
    fail_msg: "ssh_config_cloud must be one of {{ ssh_config_clouds | default(['gcp', 'aws', 'local']) }}."

- name: Select SSH hosts that have a non-empty address
  ansible.builtin.set_fact:
    ssh_hosts_active: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for h in (ssh_hosts | default({})) | dict2items -%}
        {%- if h.value is string -%}
          {%- set addr = h.value | default('', true) | string | trim -%}
        {%- else -%}
          {%- set addr = (h.value.hostname | default(h.value.ip | default(''), true)) | default('', true) | string | trim -%}
        {%- endif -%}
        {%- if addr -%}
          {%- set ns.items = ns.items + [h] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Validate per-host SSH cloud
  ansible.builtin.assert:
    that:
      - (item.value.cloud | default(ssh_config_cloud)) in (ssh_config_clouds | default(['gcp', 'aws', 'local']))
    fail_msg: "Host {{ item.key }} cloud must be one of {{ ssh_config_clouds | default(['gcp', 'aws', 'local']) }}."
  loop: "{{ ssh_hosts_active }}"
  when: item.value is mapping and item.value.cloud is defined

- name: Ensure SSH directory exists
  ansible.builtin.file:
    path: "{{ ssh_config_dir }}"
    state: directory
    mode: "0700"

- name: Ensure SSH config.d directory exists
  ansible.builtin.file:
    path: "{{ ssh_config_d_dir }}"
    state: directory
    mode: "0700"
  when: ssh_config_use_include | bool

- name: Ensure main SSH config file exists
  ansible.builtin.file:
    path: "{{ ssh_config_file }}"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  when: ssh_config_use_include | bool

- name: Ensure Include directive is present at top of main SSH config
  ansible.builtin.lineinfile:
    path: "{{ ssh_config_file }}"
    line: "Include ~/.ssh/config.d/*"
    insertbefore: BOF
    state: present
    mode: "0600"
  when: ssh_config_use_include | bool

- name: Ensure known_hosts file exists
  ansible.builtin.file:
    path: "{{ ssh_known_hosts_file }}"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Remove stale host keys from known_hosts via ssh-keygen (by IP)
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -f
      - "{{ ssh_known_hosts_file }}"
      - -R
      - "{{ item.value if (item.value is string) else (item.value.hostname | default(item.value.ip)) }}"
  loop: "{{ ssh_hosts_active }}"
  when: ssh_config_clean_known_hosts | bool
  register: ssh_keygen_ip_result
  changed_when:
    - "'updated' in (ssh_keygen_ip_result.stderr | default('')) or 'found' in (ssh_keygen_ip_result.stdout | default(''))"

- name: Remove stale host keys from known_hosts via ssh-keygen (by hostname)
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -f
      - "{{ ssh_known_hosts_file }}"
      - -R
      - "{{ item.key }}"
  loop: "{{ ssh_hosts_active }}"
  when: ssh_config_clean_known_hosts | bool
  register: ssh_keygen_host_result
  changed_when:
    - "'updated' in (ssh_keygen_host_result.stderr | default('')) or 'found' in (ssh_keygen_host_result.stdout | default(''))"

- name: Generate SSH configuration file
  ansible.builtin.template:
    src: config.j2
    dest: "{{ ssh_config_dest_file }}"
    mode: "0600"

- name: Automatically scan and add host public keys to known_hosts (by IP and Hostname)
  ansible.builtin.shell: |
    TARGET="{{ item.value if (item.value is string) else (item.value.hostname | default(item.value.ip)) }}"
    ALIAS="{{ item.key }}"
    if [ -n "$TARGET" ]; then
      ssh-keyscan -H -t ed25519,ecdsa,rsa "$TARGET" "$ALIAS" >> "{{ ssh_known_hosts_file }}" 2>/dev/null || true
    fi
  loop: "{{ ssh_hosts_active }}"
  when: ssh_config_scan_known_hosts | default(true) | bool
  changed_when: false
