---
ssh_config_cloud: aws
ssh_config_clouds:
  - gcp
  - aws

ssh_config_gcp_user: "entelektuelmaganda"
ssh_config_gcp_identity_file: "~/.ssh/gcp_k3s"
ssh_config_aws_user: "ubuntu"
ssh_config_aws_identity_file: "~/.ssh/fci_keypair.pem"
ssh_config_identities_only: "yes"

ssh_config_dir: "{{ '~/.ssh' | expanduser }}"
ssh_config_file: "{{ '~/.ssh/config' | expanduser }}"
ssh_known_hosts_file: "{{ '~/.ssh/known_hosts' | expanduser }}"

ssh_config_clean_known_hosts: false
ssh_config_scan_known_hosts: true
ssh_config_strict_host_key_checking: "no"

ssh_hosts: {}
ssh_config_custom_hosts: []
