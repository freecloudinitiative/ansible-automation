---
- name: Ensure local .kube directory exists on control node
  ansible.builtin.file:
    path: "{{ local_kubeconfig_path | dirname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Fetch kubeconfig from primary master node
  ansible.builtin.fetch:
    src: "{{ kubeconfig_remote_path }}"
    dest: "{{ local_kubeconfig_path }}"
    flat: true
  become: true

- name: Determine master public target IP address
  ansible.builtin.set_fact:
    target_master_public_ip: "{{ k3s_master_public_ip | default(ansible_host | default((ansible_facts.default_ipv4.address if ansible_facts.default_ipv4 is defined else ''))) }}"

- name: Replace loopback IP with public master IP in local kubeconfig
  ansible.builtin.replace:
    path: "{{ local_kubeconfig_path }}"
    regexp: '127\.0\.0\.1'
    replace: "{{ target_master_public_ip }}"
  delegate_to: localhost
  become: false

- name: Enable insecure-skip-tls-verify for public IP access in local kubeconfig
  ansible.builtin.replace:
    path: "{{ local_kubeconfig_path }}"
    regexp: 'certificate-authority-data:.*'
    replace: 'insecure-skip-tls-verify: true'
  delegate_to: localhost
  become: false

- name: Ensure correct permissions on local kubeconfig
  ansible.builtin.file:
    path: "{{ local_kubeconfig_path }}"
    mode: '0600'
  delegate_to: localhost
  become: false

- name: Set downloaded kubeconfig as default ~/.kube/config
  ansible.builtin.copy:
    src: "{{ local_kubeconfig_path }}"
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    mode: '0600'
  delegate_to: localhost
  become: false
  when: set_as_default_kubeconfig | default(true) | bool

- name: Check if k9s is already installed on local machine
  ansible.builtin.command: which k9s
  register: local_k9s_check
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  when: install_local_k9s | bool

- name: Install K9s on macOS via Homebrew if missing
  community.general.homebrew:
    name: k9s
    state: present
  delegate_to: localhost
  become: false
  when:
    - install_local_k9s | bool
    - local_k9s_check.rc != 0
  ignore_errors: true

- name: Re-check if k9s is installed after Homebrew step
  ansible.builtin.command: which k9s
  register: local_k9s_check_after_brew
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  when: install_local_k9s | bool

- name: Detect architecture on local Mac
  ansible.builtin.command: uname -m
  register: local_uname_m
  changed_when: false
  delegate_to: localhost
  become: false
  when:
    - install_local_k9s | bool
    - local_k9s_check_after_brew.rc != 0

- name: Set local Mac K9s download architecture
  ansible.builtin.set_fact:
    local_k9s_arch: "{{ k9s_arch_map[local_uname_m.stdout | default('arm64')] | default('arm64') }}"
  when:
    - install_local_k9s | bool
    - local_k9s_check_after_brew.rc != 0

- name: Download K9s v0.32.7 archive for macOS (fallback)
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/k9s_Darwin_{{ local_k9s_arch }}.tar.gz"
    dest: "/tmp/k9s_Darwin_{{ local_k9s_arch }}.tar.gz"
    mode: '0644'
  delegate_to: localhost
  become: false
  when:
    - install_local_k9s | bool
    - local_k9s_check_after_brew.rc != 0

- name: Ensure local install directory exists
  ansible.builtin.file:
    path: "{{ k9s_install_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  when:
    - install_local_k9s | bool
    - local_k9s_check_after_brew.rc != 0

- name: Extract K9s binary on macOS (fallback)
  ansible.builtin.command:
    cmd: "tar -xzf /tmp/k9s_Darwin_{{ local_k9s_arch }}.tar.gz -C {{ k9s_install_dir }} k9s"
    creates: "{{ k9s_install_dir }}/k9s"
  delegate_to: localhost
  become: false
  when:
    - install_local_k9s | bool
    - local_k9s_check_after_brew.rc != 0

- name: Symlink K9s into /usr/local/bin for standard PATH access
  ansible.builtin.file:
    src: "{{ k9s_install_dir }}/k9s"
    dest: "/usr/local/bin/k9s"
    state: link
    force: true
  delegate_to: localhost
  become: false
  ignore_errors: true
  when:
    - install_local_k9s | bool
    - local_k9s_check_after_brew.rc != 0

- name: Clean up temporary K9s archive file
  ansible.builtin.file:
    path: "/tmp/k9s_Darwin_{{ local_k9s_arch }}.tar.gz"
    state: absent
  delegate_to: localhost
  become: false
  when:
    - install_local_k9s | bool
    - local_k9s_check_after_brew.rc != 0

- name: Display connection instructions
  ansible.builtin.debug:
    msg:
      - "Kubeconfig successfully configured at ~/.kube/config"
      - "K9s is installed and ready! Simply execute:"
      - "  k9s"
