---
- name: Create Kyverno stack directory
  ansible.builtin.file:
    path: "{{ kyverno_stack_dir }}"
    state: directory
    mode: "0755"

- name: Add Kyverno Helm repo
  kubernetes.core.helm_repository:
    name: kyverno
    repo_url: "{{ kyverno_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Ensure Kyverno namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ kyverno_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Render Kyverno values from template
  ansible.builtin.template:
    src: kyverno-values.yaml.j2
    dest: "{{ kyverno_stack_dir }}/kyverno-values.yaml"
    mode: "0644"

- name: Install Kyverno via Helm
  kubernetes.core.helm:
    name: "{{ kyverno_release_name }}"
    chart_ref: kyverno/kyverno
    release_namespace: "{{ kyverno_namespace }}"
    create_namespace: false
    values_files:
      - "{{ kyverno_stack_dir }}/kyverno-values.yaml"
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 5m
    state: present

- name: Wait for Kyverno admission controller to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=Available
      - deployment/kyverno-admission-controller
      - -n
      - "{{ kyverno_namespace }}"
      - --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Render ClusterPolicies from template
  ansible.builtin.template:
    src: kyverno-policies.yaml.j2
    dest: "{{ kyverno_stack_dir }}/kyverno-policies.yaml"
    mode: "0644"

- name: Apply ClusterPolicies
  kubernetes.core.k8s:
    state: present
    src: "{{ kyverno_stack_dir }}/kyverno-policies.yaml"
    kubeconfig: "{{ kubeconfig_path }}"

- name: List applied ClusterPolicies
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - clusterpolicy
      - -o
      - "custom-columns=NAME:.metadata.name,MODE:.spec.validationFailureAction,BACKGROUND:.spec.background"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: kyverno_policies_list
  changed_when: false

- name: Add Policy Reporter Helm repo
  kubernetes.core.helm_repository:
    name: policy-reporter
    repo_url: "{{ kyverno_policy_reporter_helm_repo_url }}"
  when: kyverno_policy_reporter_enabled | bool

- name: Render Policy Reporter values from template
  ansible.builtin.template:
    src: policy-reporter-values.yaml.j2
    dest: "{{ kyverno_stack_dir }}/policy-reporter-values.yaml"
    mode: "0644"
  when: kyverno_policy_reporter_enabled | bool

- name: Install Policy Reporter via Helm
  kubernetes.core.helm:
    name: "{{ kyverno_policy_reporter_release_name }}"
    chart_ref: policy-reporter/policy-reporter
    release_namespace: "{{ kyverno_namespace }}"
    create_namespace: false
    values_files:
      - "{{ kyverno_stack_dir }}/policy-reporter-values.yaml"
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 5m
    state: present
  when: kyverno_policy_reporter_enabled | bool

- name: Setup Policy Reporter UI port-forwarding
  ansible.builtin.command:
    argv:
      - kubectl
      - port-forward
      - --address
      - "{{ port_forward_address }}"
      - "{{ kyverno_ui_service_name }}"
      - -n
      - "{{ kyverno_namespace }}"
      - "{{ kyverno_ui_port_forward_local_port }}:{{ kyverno_ui_port_forward_remote_port }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  async: 3600
  poll: 0
  register: kyverno_ui_port_forward_job
  when: port_forward_enabled | bool and kyverno_ui_enabled | bool

- name: Display Kyverno setup info
  ansible.builtin.debug:
    msg:
      status: "Kyverno installed and ClusterPolicies applied"
      policy_mode: "{{ kyverno_policy_mode }}"
      ui_enabled: "{{ kyverno_ui_enabled }}"
      ui_access_url: "{{ 'http://' ~ k3s_master1_public_ip ~ ':' ~ kyverno_ui_port_forward_local_port if (port_forward_enabled | bool and kyverno_ui_enabled | bool and k3s_master1_public_ip is defined) else 'N/A' }}"
      namespace: "{{ kyverno_namespace }}"
      check_policy_reports_command: "kubectl get policyreport -A --kubeconfig {{ kubeconfig_path }}"
      active_policies: "{{ kyverno_policies_list.stdout_lines }}"
      note: >-
        Policies are in '{{ kyverno_policy_mode }}' mode.
        Change kyverno_policy_mode to 'enforce' when ready to block violations.
