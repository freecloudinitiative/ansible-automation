---
- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  become: true
  register: k3s_script_download

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s server with cluster-init
  ansible.builtin.command:
    argv:
      - /tmp/k3s-install.sh
      - server
      - --cluster-init
      - --disable
      - servicelb
      - --disable
      - metrics-server
      - --node-name=master
      - "--node-ip={{ ansible_default_ipv4.address }}"
      - "--advertise-address={{ ansible_default_ipv4.address }}"
      - "--tls-san={{ ansible_default_ipv4.address }}"
      - --token-file
      - /etc/k3s-bootstrap-token
      - --etcd-snapshot-schedule-cron=0 */6 * * *
      - --etcd-snapshot-retention=10
      - --write-kubeconfig-mode=640
      - --kube-apiserver-arg=authorization-mode=Node,RBAC
  become: true
  when: not k3s_binary.stat.exists or k3s_script_download.changed
  register: k3s_install
  changed_when: "'k3s' in k3s_install.stdout"

- name: Wait for k3s to be ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - --raw=/readyz
  register: k3s_readyz
  until: k3s_readyz.rc == 0 and 'ok' in k3s_readyz.stdout
  retries: 12
  delay: 5
  changed_when: false


- name: Verify k3s installation
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - --version
  register: k3s_version
  changed_when: false

- name: Display k3s version
  ansible.builtin.debug:
    msg: "K3s installed: {{ k3s_version.stdout }}"

- name: Read k3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token
  become: true
  no_log: true


- name: Store master node IP address
  ansible.builtin.set_fact:
    k3s_master_ip: "{{ ansible_default_ipv4.address }}"
