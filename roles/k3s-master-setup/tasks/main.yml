---
- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  become: true
  register: k3s_script_download

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s server on primary master node with cluster-init
  ansible.builtin.command:
    argv:
      - /tmp/k3s-install.sh
      - server
      - --cluster-init
      - --disable
      - traefik
      - --disable
      - servicelb
      - --embedded-registry
      - "--node-name={{ inventory_hostname }}"
      - "--node-ip={{ ansible_facts.default_ipv4.address }}"
      - "--advertise-address={{ ansible_facts.default_ipv4.address }}"
      - "--tls-san={{ ansible_facts.default_ipv4.address }}"
  become: true
  when:
    - inventory_hostname == groups['masters'][0]
    - not k3s_binary.stat.exists or k3s_script_download.changed
  register: k3s_install_primary
  changed_when: "'k3s' in k3s_install_primary.stdout or k3s_install_primary.rc == 0"

- name: Join secondary k3s master nodes to the HA cluster
  ansible.builtin.command:
    argv:
      - /tmp/k3s-install.sh
      - server
      - "--server=https://{{ k3s_master1_public_ip }}:6443"
      - "--token={{ k3s_node_token }}"
      - --disable
      - traefik
      - --disable
      - servicelb
      - --embedded-registry
      - "--node-name={{ inventory_hostname }}"
      - "--node-ip={{ ansible_facts.default_ipv4.address }}"
      - "--advertise-address={{ ansible_facts.default_ipv4.address }}"
      - "--tls-san={{ ansible_facts.default_ipv4.address }}"
  become: true
  when:
    - inventory_hostname != groups['masters'][0]
    - not k3s_binary.stat.exists or k3s_script_download.changed
  register: k3s_install_secondary
  changed_when: "'k3s' in k3s_install_secondary.stdout or k3s_install_secondary.rc == 0"

- name: Wait for k3s to be ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - --raw=/readyz
  register: k3s_readyz
  until: k3s_readyz.rc == 0 and 'ok' in k3s_readyz.stdout
  retries: 12
  delay: 5
  changed_when: false

- name: Create k3s local storage directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/storage
    state: directory
    mode: "0755"
  become: true

- name: Verify k3s installation
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - --version
  register: k3s_version
  changed_when: false

- name: Display k3s version
  ansible.builtin.debug:
    var: k3s_version.stdout_lines

- name: Ensure permissions on k3s kubeconfig file
  ansible.builtin.file:
    path: "{{ kubeconfig_path }}"
    mode: '0600'
  become: true

- name: Create .kube directory for user
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.kube"
    state: directory
    mode: '0755'
    owner: "{{ ansible_facts.env.USER }}"
    group: "{{ ansible_facts.env.USER }}"

- name: Copy k3s kubeconfig to user .kube directory
  ansible.builtin.copy:
    src: "{{ kubeconfig_path }}"
    dest: "{{ ansible_facts.env.HOME }}/.kube/config"
    remote_src: true
    mode: '0600'
    owner: "{{ ansible_facts.env.USER }}"
    group: "{{ ansible_facts.env.USER }}"

- name: Ensure KUBECONFIG environment variable is set in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.env.HOME }}/.bashrc"
    line: 'export KUBECONFIG=~/.kube/config'
    regexp: '^export KUBECONFIG='
    state: present

- name: Check if Helm is installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary

- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: '0755'
  when: not helm_binary.stat.exists

- name: Install Helm
  ansible.builtin.command:
    cmd: /tmp/get_helm.sh
  become: true
  when: not helm_binary.stat.exists
  register: helm_install
  changed_when: helm_install.rc == 0

# --- kubectx & kubens ---
- name: Resolve architecture for kubectx/kubens
  ansible.builtin.set_fact:
    _go_arch: "{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Check if kubectx is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/kubectx
  register: kubectx_binary

- name: Download kubectx and kubens
  ansible.builtin.get_url:
    url: "https://github.com/ahmetb/kubectx/releases/download/{{ kubectx_version }}/{{ item.bin }}_{{ kubectx_version }}_linux_{{ _go_arch }}.tar.gz"
    dest: "/tmp/{{ item.bin }}.tar.gz"
    mode: '0644'
  loop:
    - { bin: kubectx }
    - { bin: kubens }
  when: not kubectx_binary.stat.exists

- name: Install kubectx and kubens
  ansible.builtin.unarchive:
    src: "/tmp/{{ item }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include:
      - "{{ item }}"
    mode: '0755'
  become: true
  loop:
    - kubectx
    - kubens
  when: not kubectx_binary.stat.exists

# --- popeye ---
- name: Check if popeye is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/popeye
  register: popeye_binary

- name: Download popeye
  ansible.builtin.get_url:
    url: "https://github.com/derailed/popeye/releases/download/{{ popeye_version }}/popeye_linux_{{ _go_arch }}.tar.gz"
    dest: /tmp/popeye.tar.gz
    mode: '0644'
  when: not popeye_binary.stat.exists

- name: Install popeye
  ansible.builtin.unarchive:
    src: /tmp/popeye.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - popeye
    mode: '0755'
  become: true
  when: not popeye_binary.stat.exists

# --- stern ---
- name: Check if stern is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/stern
  register: stern_binary

- name: Download stern
  ansible.builtin.get_url:
    url: "https://github.com/stern/stern/releases/download/{{ stern_version }}/stern_{{ stern_version | regex_replace('^v', '') }}_linux_{{ _go_arch }}.tar.gz"
    dest: /tmp/stern.tar.gz
    mode: '0644'
  when: not stern_binary.stat.exists

- name: Install stern
  ansible.builtin.unarchive:
    src: /tmp/stern.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - stern
    mode: '0755'
  become: true
  when: not stern_binary.stat.exists

# --- kube-ps1 ---
- name: Check if kube-ps1 is already installed
  ansible.builtin.stat:
    path: /usr/local/share/kube-ps1/kube-ps1.sh
  register: kube_ps1_script

- name: Ensure kube-ps1 install directory exists
  ansible.builtin.file:
    path: /usr/local/share/kube-ps1
    state: directory
    mode: '0755'
  become: true
  when: not kube_ps1_script.stat.exists

- name: Download kube-ps1 script
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/jonmosco/kube-ps1/{{ kube_ps1_version }}/kube-ps1.sh"
    dest: /usr/local/share/kube-ps1/kube-ps1.sh
    mode: '0755'
  become: true
  when: not kube_ps1_script.stat.exists

- name: Source kube-ps1 in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts.env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK — kube-ps1"
    block: |
      source /usr/local/share/kube-ps1/kube-ps1.sh
      PS1='$(kube_ps1)'$PS1
