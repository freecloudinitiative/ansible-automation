---
- name: Disable swap on master
  ansible.builtin.command:
    argv:
      - swapoff
      - -a
  changed_when: ansible_facts.swaptotal_mb | default(0) | int > 0

- name: Disable swap in fstab on master
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^\s*(\S+)\s+\S+\s+swap\s+.*$'
    replace: '# \g<0>'

- name: Gather master service facts
  ansible.builtin.service_facts:

- name: Disable dphys-swapfile service on master
  ansible.builtin.service:
    name: dphys-swapfile
    enabled: false
    state: stopped
  when: >-
    'dphys-swapfile.service' in ansible_facts.services or
    'dphys-swapfile' in ansible_facts.services

- name: Update apt cache on master
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Install master prerequisites
  ansible.builtin.apt:
    name: "{{ k3s_master_required_packages }}"
    state: present
    lock_timeout: 300

- name: Upgrade Kubernetes Python libraries on master
  ansible.builtin.pip:
    name:
      - "kubernetes>=24.2.0"
      - jsonpatch
      - PyYAML
    state: present
    extra_args: "--break-system-packages --ignore-installed"
  ignore_errors: true

# k3s_master1_public_ip is the join URL every other node dials
# (--server=https://<this>:6443). Named "public" from the cloud-only days;
# for an all-local fleet there's no public IP to give, so an explicit,
# non-empty value still wins (cloud/mixed setups keep working unchanged),
# but an unset/blank one now falls back to master-1's own LAN address --
# gathered a few lines below by this same play's gather_facts: true,
# so no separate discovery step is needed.
- name: Resolve k3s_master1_public_ip from master-1's LAN address when unset
  ansible.builtin.set_fact:
    k3s_master1_public_ip: "{{ ansible_facts.default_ipv4.address }}"
  when:
    - inventory_hostname == groups['masters'][0]
    - k3s_master1_public_ip | default('', true) | trim | length == 0

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  become: true
  register: k3s_script_download

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s server on primary master node with cluster-init
  ansible.builtin.command:
    argv:
      - /tmp/k3s-install.sh
      - server
      - --cluster-init
      - --disable
      - traefik
      - --disable
      - servicelb
      - --embedded-registry
      - "--node-name={{ inventory_hostname }}"
      - "--node-ip={{ ansible_facts.default_ipv4.address }}"
      - "--advertise-address={{ ansible_facts.default_ipv4.address }}"
      - "--tls-san={{ ansible_facts.default_ipv4.address }}"
  become: true
  when:
    - inventory_hostname == groups['masters'][0]
    - not k3s_binary.stat.exists or k3s_script_download.changed
  register: k3s_install_primary
  changed_when: "'k3s' in k3s_install_primary.stdout or k3s_install_primary.rc == 0"

- name: Join secondary k3s master nodes to the HA cluster
  ansible.builtin.command:
    argv:
      - /tmp/k3s-install.sh
      - server
      - "--server=https://{{ hostvars[groups['masters'][0]]['k3s_master1_public_ip'] }}:6443"
      - "--token={{ k3s_node_token }}"
      - --disable
      - traefik
      - --disable
      - servicelb
      - --embedded-registry
      - "--node-name={{ inventory_hostname }}"
      - "--node-ip={{ ansible_facts.default_ipv4.address }}"
      - "--advertise-address={{ ansible_facts.default_ipv4.address }}"
      - "--tls-san={{ ansible_facts.default_ipv4.address }}"
  become: true
  when:
    - inventory_hostname != groups['masters'][0]
    - not k3s_binary.stat.exists or k3s_script_download.changed
  register: k3s_install_secondary
  changed_when: "'k3s' in k3s_install_secondary.stdout or k3s_install_secondary.rc == 0"

- name: Wait for k3s to be ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - --raw=/readyz
  register: k3s_readyz
  until: k3s_readyz.rc == 0 and 'ok' in k3s_readyz.stdout
  retries: 12
  delay: 5
  changed_when: false

- name: Create k3s local storage directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/storage
    state: directory
    mode: "0755"
  become: true

- name: Verify k3s installation
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - --version
  register: k3s_version
  changed_when: false

- name: Display k3s version
  ansible.builtin.debug:
    var: k3s_version.stdout_lines

- name: Ensure permissions on k3s kubeconfig file
  ansible.builtin.file:
    path: "{{ kubeconfig_path }}"
    mode: '0600'
  become: true

- name: Create .kube directory for user
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.kube"
    state: directory
    mode: '0755'
    owner: "{{ ansible_facts.env.USER }}"
    group: "{{ ansible_facts.env.USER }}"

- name: Copy k3s kubeconfig to user .kube directory
  ansible.builtin.copy:
    src: "{{ kubeconfig_path }}"
    dest: "{{ ansible_facts.env.HOME }}/.kube/config"
    remote_src: true
    mode: '0600'
    owner: "{{ ansible_facts.env.USER }}"
    group: "{{ ansible_facts.env.USER }}"

- name: Ensure KUBECONFIG environment variable is set in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.env.HOME }}/.bashrc"
    line: 'export KUBECONFIG=~/.kube/config'
    regexp: '^export KUBECONFIG='
    state: present

- name: Check if Helm is installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary

- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: '0755'
  when: not helm_binary.stat.exists

- name: Install Helm
  ansible.builtin.command:
    cmd: /tmp/get_helm.sh
  become: true
  when: not helm_binary.stat.exists
  register: helm_install
  changed_when: helm_install.rc == 0

