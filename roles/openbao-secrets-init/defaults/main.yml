---
# Supply only for the bootstrap run, preferably with:
# OPENBAO_BOOTSTRAP_TOKEN=... ansible-playbook playbook.yml
openbao_bootstrap_token: "{{ lookup('ansible.builtin.env', 'OPENBAO_BOOTSTRAP_TOKEN') | default('', true) }}"
openbao_namespace: openbao
openbao_health_service_name: openbao
openbao_service_name: openbao-active
openbao_kubernetes_auth_role: external-secrets
openbao_external_secrets_service_account: external-secrets-openbao
openbao_external_secrets_namespace: external-secrets
openbao_external_secrets_audience: vault
openbao_endpoint_discovery_timeout: 600
openbao_endpoint_discovery_delay: 5
openbao_endpoint_probe_timeout: 3
grafana_admin_user: admin
grafana_admin_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') | default('', true) }}"
authentik_admin_token: "{{ lookup('ansible.builtin.env', 'AUTHENTIK_ADMIN_TOKEN') | default('', true) }}"
authentik_bootstrap_email: "{{ lookup('ansible.builtin.env', 'AUTHENTIK_BOOTSTRAP_EMAIL') | default('admin@freecloudinitiative.com', true) }}"
authentik_bootstrap_password: "{{ lookup('ansible.builtin.env', 'AUTHENTIK_BOOTSTRAP_PASSWORD') | default('', true) }}"
authentik_postgresql_password: "{{ lookup('ansible.builtin.env', 'AUTHENTIK_POSTGRESQL_PASSWORD') | default('', true) }}"
authentik_secret_key: "{{ lookup('ansible.builtin.env', 'AUTHENTIK_SECRET_KEY') | default('', true) }}"
authentik_grafana_oidc_secret: "{{ lookup('ansible.builtin.env', 'AUTHENTIK_GRAFANA_OIDC_SECRET') | default('', true) }}"
authentik_argocd_oidc_secret: "{{ lookup('ansible.builtin.env', 'AUTHENTIK_ARGOCD_OIDC_SECRET') | default('', true) }}"
authentik_zot_oidc_secret: "{{ lookup('ansible.builtin.env', 'AUTHENTIK_ZOT_OIDC_SECRET') | default('', true) }}"
api_gateway_internal_public_key: "{{ lookup('ansible.builtin.env', 'API_GATEWAY_INTERNAL_PUBLIC_KEY') | default('', true) }}"
api_gateway_internal_signing_key: "{{ lookup('ansible.builtin.env', 'API_GATEWAY_INTERNAL_SIGNING_KEY') | default('', true) }}"
cloudflared_tunnel_token: "{{ lookup('ansible.builtin.env', 'CLOUDFLARED_TUNNEL_TOKEN') | default('', true) }}"
compute_postgresql_password: "{{ lookup('ansible.builtin.env', 'COMPUTE_POSTGRESQL_PASSWORD') | default('', true) }}"
compute_internal_public_key: "{{ lookup('ansible.builtin.env', 'COMPUTE_INTERNAL_PUBLIC_KEY') | default('', true) }}"
compute_internal_signing_key: "{{ lookup('ansible.builtin.env', 'COMPUTE_INTERNAL_SIGNING_KEY') | default('', true) }}"
database_postgresql_password: "{{ lookup('ansible.builtin.env', 'DATABASE_POSTGRESQL_PASSWORD') | default('', true) }}"
database_internal_public_key: "{{ lookup('ansible.builtin.env', 'DATABASE_INTERNAL_PUBLIC_KEY') | default('', true) }}"
database_internal_signing_key: "{{ lookup('ansible.builtin.env', 'DATABASE_INTERNAL_SIGNING_KEY') | default('', true) }}"

garage_storage_service_access_key: "{{ lookup('ansible.builtin.env', 'GARAGE_STORAGE_SERVICE_ACCESS_KEY') | default('', true) }}"
garage_storage_service_secret_key: "{{ lookup('ansible.builtin.env', 'GARAGE_STORAGE_SERVICE_SECRET_KEY') | default('', true) }}"
iam_postgresql_password: "{{ lookup('ansible.builtin.env', 'IAM_POSTGRESQL_PASSWORD') | default('', true) }}"

platform_postgresql_password: "{{ lookup('ansible.builtin.env', 'PLATFORM_POSTGRESQL_PASSWORD') | default('', true) }}"
storage_postgresql_password: "{{ lookup('ansible.builtin.env', 'STORAGE_POSTGRESQL_PASSWORD') | default('', true) }}"
storage_internal_public_key: "{{ lookup('ansible.builtin.env', 'STORAGE_INTERNAL_PUBLIC_KEY') | default('', true) }}"
storage_internal_signing_key: "{{ lookup('ansible.builtin.env', 'STORAGE_INTERNAL_SIGNING_KEY') | default('', true) }}"
terminal_gateway_internal_public_key: "{{ lookup('ansible.builtin.env', 'TERMINAL_GATEWAY_INTERNAL_PUBLIC_KEY') | default('', true) }}"
terminal_gateway_internal_signing_key: "{{ lookup('ansible.builtin.env', 'TERMINAL_GATEWAY_INTERNAL_SIGNING_KEY') | default('', true) }}"

valkey_password: "{{ lookup('ansible.builtin.env', 'VALKEY_PASSWORD') | default('', true) }}"
zot_registry_htpasswd: "{{ lookup('ansible.builtin.env', 'ZOT_REGISTRY_HTPASSWD') | default('', true) }}"
zot_registry_pull_password: "{{ lookup('ansible.builtin.env', 'ZOT_REGISTRY_PULL_PASSWORD') | default('', true) }}"
zot_registry_pull_username: "{{ lookup('ansible.builtin.env', 'ZOT_REGISTRY_PULL_USERNAME') | default('', true) }}"
zot_registry_s3_access_key_id: "{{ lookup('ansible.builtin.env', 'ZOT_REGISTRY_S3_ACCESS_KEY_ID') | default('', true) }}"
zot_registry_s3_secret_access_key: "{{ lookup('ansible.builtin.env', 'ZOT_REGISTRY_S3_SECRET_ACCESS_KEY') | default('', true) }}"
ghcr_registry_username: "{{ lookup('ansible.builtin.env', 'GHCR_REGISTRY_USERNAME') | default('', true) }}"
ghcr_registry_token: "{{ lookup('ansible.builtin.env', 'GHCR_REGISTRY_TOKEN') | default('', true) }}"

openbao_secrets:
  - path: grafana
    data:
      admin-user: "{{ grafana_admin_user }}"
      admin-password: "{{ grafana_admin_password }}"
  - path: authentik
    data:
      bootstrap-email: "{{ authentik_bootstrap_email }}"
      bootstrap-password: "{{ authentik_bootstrap_password }}"
      postgresql-password: "{{ authentik_postgresql_password }}"
      secret-key: "{{ authentik_secret_key }}"
      admin-token: "{{ authentik_admin_token }}"
      grafana-oidc-secret: "{{ authentik_grafana_oidc_secret }}"
      argocd-oidc-secret: "{{ authentik_argocd_oidc_secret }}"
      zot-oidc-secret: "{{ authentik_zot_oidc_secret }}"
  - path: platform-postgresql
    data:
      password: "{{ platform_postgresql_password }}"
      ca-cert: "{{ cluster_ca_cert }}"
  - path: valkey
    data:
      password: "{{ valkey_password }}"
      ca-cert: "{{ cluster_ca_cert }}"
  - path: api-gateway
    data:
      internal-public-key: "{{ api_gateway_internal_public_key }}"
      internal-signing-key: "{{ api_gateway_internal_signing_key }}"
  - path: cloudflared
    data:
      tunnel-token: "{{ cloudflared_tunnel_token }}"
  - path: compute
    data:
      postgresql-password: "{{ compute_postgresql_password }}"
      internal-public-key: "{{ compute_internal_public_key }}"
      internal-signing-key: "{{ compute_internal_signing_key }}"
  - path: database
    data:
      postgresql-password: "{{ database_postgresql_password }}"
      internal-public-key: "{{ database_internal_public_key }}"
      internal-signing-key: "{{ database_internal_signing_key }}"
  - path: garage
    data:
      ca-cert: "{{ cluster_ca_cert }}"
      storage-service-access-key: "{{ garage_storage_service_access_key }}"
      storage-service-secret-key: "{{ garage_storage_service_secret_key }}"
  - path: iam
    data:
      postgresql-password: "{{ iam_postgresql_password }}"
  - path: storage
    data:
      postgresql-password: "{{ storage_postgresql_password }}"
      internal-public-key: "{{ storage_internal_public_key }}"
      internal-signing-key: "{{ storage_internal_signing_key }}"
  - path: terminal-gateway
    data:
      internal-public-key: "{{ terminal_gateway_internal_public_key }}"
      internal-signing-key: "{{ terminal_gateway_internal_signing_key }}"
  - path: zot-registry
    data:
      htpasswd: "{{ zot_registry_htpasswd }}"
      pull-password: "{{ zot_registry_pull_password }}"
      pull-username: "{{ zot_registry_pull_username }}"
      s3-access-key-id: "{{ zot_registry_s3_access_key_id }}"
      s3-secret-access-key: "{{ zot_registry_s3_secret_access_key }}"
      ghcr-username: "{{ ghcr_registry_username }}"
      ghcr-token: "{{ ghcr_registry_token }}"
