---
# Second-run task file — included from main.yml only when authentik_admin_token
# is non-empty, or run directly with --tags authentik-token once the Authentik
# bootstrap admin exists and a service-account API token has been created.
#
# PATCH with application/merge-patch+json targets only the admin-token field.
# A POST to secret/data/authentik would replace the whole KV v2 payload and
# blank bootstrap-email, bootstrap-password, postgresql-password, secret-key,
# and the three OIDC secrets.

- name: Require the Authentik admin token for this run
  ansible.builtin.assert:
    that:
      - authentik_admin_token | length >= 32
    fail_msg: >-
      AUTHENTIK_ADMIN_TOKEN is not set. Authentik does not exist during the
      first seed run, so this value is seeded separately once the bootstrap
      admin exists. Create an API token for a service account with user and
      group write scope, then rerun:
        AUTHENTIK_ADMIN_TOKEN='...' OPENBAO_BOOTSTRAP_TOKEN='hvs....' \
          ansible-playbook playbook.yml --tags authentik-token
      Until this is set, iam-service starts normally and every Authentik user
      sync fails silently at WARN — dashboard-created IAM users cannot sign in.
  no_log: true

- name: Seed the Authentik admin token in OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/authentik"
    method: PATCH
    validate_certs: false
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
      Content-Type: application/merge-patch+json
    body_format: json
    body:
      data:
        admin-token: "{{ authentik_admin_token }}"
    status_code: [200, 204]
  no_log: true
  delegate_to: "{{ openbao_api_delegate }}"
