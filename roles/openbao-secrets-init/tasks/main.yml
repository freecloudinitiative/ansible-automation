---
- name: Ensure external-secrets namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ openbao_external_secrets_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
  tags: [openbao, bootstrap]

- name: Initialize OpenBao health discovery state
  ansible.builtin.set_fact:
    openbao_health: {}
    openbao_discovery_deadline_epoch: >-
      {{ (lookup('ansible.builtin.pipe', 'date +%s') | int)
         + (openbao_endpoint_discovery_timeout | int) }}
    openbao_endpoint_discovery_attempts: >-
      {{ ((openbao_endpoint_discovery_timeout | int)
          // (openbao_endpoint_discovery_delay | int)) + 2 }}
  tags: [openbao, bootstrap, authentik-token]

- name: Discover and probe current OpenBao health endpoints
  ansible.builtin.include_tasks:
    file: discover-health-endpoint.yml
    apply:
      tags: [openbao, bootstrap, authentik-token]
  loop: "{{ range(0, openbao_endpoint_discovery_attempts | int) | list }}"
  loop_control:
    loop_var: openbao_health_discovery_attempt
    label: "attempt {{ openbao_health_discovery_attempt + 1 }}"
  when:
    - (openbao_health.status | default(0) | int) not in [200, 429, 501, 503]
    - >-
      lookup('ansible.builtin.pipe', 'date +%s') | int
      < openbao_discovery_deadline_epoch | int
  tags: [openbao, bootstrap, authentik-token]

- name: Require a reachable OpenBao health endpoint
  ansible.builtin.assert:
    that:
      - (openbao_health.status | default(0) | int) in [200, 429, 501, 503]
    fail_msg: >-
      No current OpenBao endpoint returned a recognized health status after
      the shared {{ openbao_endpoint_discovery_timeout }}-second discovery window.
      Each attempt refreshed EndpointSlices and probed every non-terminating
      endpoint from its local inventory node.
  tags: [openbao, bootstrap, authentik-token]

- name: Automate OpenBao initialization if uninitialized or sealed
  ansible.builtin.include_tasks: init.yml
  when: (openbao_health.status | default(0) | int) in [501, 503]
  tags: [openbao, bootstrap, authentik-token]

- name: Ensure OpenBao credentials are loaded
  block:
    - name: Read OpenBao keys from master-1
      ansible.builtin.slurp:
        src: /root/openbao-cluster-keys.json
      register: openbao_keys_file
      delegate_to: master-1
      no_log: true

    - name: Set keys facts
      ansible.builtin.set_fact:
        openbao_bootstrap_token: "{{ (openbao_keys_file.content | b64decode | from_json).root_token }}"
        openbao_unseal_keys: "{{ (openbao_keys_file.content | b64decode | from_json).keys_base64 }}"
      no_log: true
  when: openbao_bootstrap_token is not defined or openbao_bootstrap_token | length == 0
  tags: [openbao, bootstrap, authentik-token]

- name: Fetch OpenBao StatefulSet to check HA readiness
  kubernetes.core.k8s_info:
    kind: StatefulSet
    name: openbao
    namespace: "{{ openbao_namespace }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
  register: openbao_sts
  tags: [openbao, bootstrap, authentik-token]

- name: Automate HA OpenBao unsealing (Wait for all replicas)
  ansible.builtin.include_tasks:
    file: unseal-replica.yml
    apply:
      tags: [openbao, bootstrap, authentik-token]
  loop: "{{ range(0, openbao_sts.resources[0].spec.replicas | default(3) | int) | list }}"
  loop_control:
    loop_var: replica_index
    label: "openbao-{{ replica_index }}"
  tags: [openbao, bootstrap, authentik-token]

# openbao_secrets references cluster_ca_cert, so the fact must exist before any task templates it.
- name: Fetch selfsigned-ca-secret from Kubernetes
  kubernetes.core.k8s_info:
    kind: Secret
    name: selfsigned-ca-secret
    namespace: cert-manager
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
  register: k8s_ca_secret
  retries: 30
  delay: 5
  until:
    - k8s_ca_secret.resources is defined
    - k8s_ca_secret.resources | length > 0
    - k8s_ca_secret.resources[0].data['ca.crt'] is defined
  no_log: true
  tags: [openbao, bootstrap]

- name: Set cluster_ca_cert fact
  ansible.builtin.set_fact:
    cluster_ca_cert: "{{ k8s_ca_secret.resources[0].data['ca.crt'] | b64decode }}"
  no_log: true
  tags: [openbao, bootstrap]

# Backstop: fail fast when any value destined for OpenBao is empty.
# Every key in openbao_secrets is written unconditionally; an empty string
# seeds successfully, the ExternalSecret syncs successfully with that empty
# value, and the failure surfaces much later as a CrashLoopBackOff or
# ImagePullBackOff with nothing pointing back at this run.
# authentik_admin_token is exempt — it is seeded empty on first run and
# populated in a second run once Authentik bootstrap has completed (PR-02).
- name: Fail when any seeded value is empty
  ansible.builtin.assert:
    that:
      - item.1.value | string | length > 0
    fail_msg: >-
      openbao_secrets[{{ item.0.path }}].{{ item.1.key }} has an empty value.
      Every value is written to OpenBao unconditionally; an unset variable seeds
      an empty string, the ExternalSecret then syncs successfully with an empty
      value, and the failure surfaces much later as a CrashLoopBackOff or
      ImagePullBackOff with nothing pointing back at this run.
  loop: >-
    {%- set ns = namespace(pairs=[]) -%}
    {%- for entry in openbao_secrets -%}
      {%- for kv in entry.data | dict2items -%}
        {%- set ns.pairs = ns.pairs + [[entry, kv]] -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ ns.pairs }}
  no_log: true
  when: not (item.1.key == 'admin-token' and item.0.path == 'authentik')
  tags: [openbao, bootstrap]

- name: Validate required production application secrets
  ansible.builtin.assert:
    that:
      # Authentik app secret + database
      - authentik_secret_key | length >= 50
      - authentik_postgresql_password | length >= 24
      - platform_postgresql_password | length >= 24
      - authentik_bootstrap_password | length >= 16
      - valkey_password | length >= 24
      - authentik_grafana_oidc_secret | length >= 16
      - authentik_argocd_oidc_secret | length >= 16
      - authentik_zot_oidc_secret | length >= 16
      - grafana_admin_password | length >= 16
      # Ed25519 keypairs. Every consumer parses these as PEM at boot and exits
      # on failure; an empty seed is a CrashLoopBackOff with no pointer here.
      - "'BEGIN PUBLIC KEY' in api_gateway_internal_public_key"
      - "'BEGIN PRIVATE KEY' in api_gateway_internal_signing_key"
      - "'BEGIN PUBLIC KEY' in terminal_gateway_internal_public_key"
      - "'BEGIN PRIVATE KEY' in terminal_gateway_internal_signing_key"
      - "'BEGIN PUBLIC KEY' in compute_internal_public_key"
      - "'BEGIN PRIVATE KEY' in compute_internal_signing_key"
      - "'BEGIN PUBLIC KEY' in database_internal_public_key"
      - "'BEGIN PRIVATE KEY' in database_internal_signing_key"
      - "'BEGIN PUBLIC KEY' in storage_internal_public_key"
      - "'BEGIN PRIVATE KEY' in storage_internal_signing_key"
      # iam-service loadTrustedKeys refuses to start when two issuers share a
      # kid, and kid is derived from the public key — so every public key across
      # every issuer must be distinct, terminal-gateway included.
      - compute_internal_public_key != database_internal_public_key
      - compute_internal_public_key != storage_internal_public_key
      - compute_internal_public_key != api_gateway_internal_public_key
      - database_internal_public_key != storage_internal_public_key
      - database_internal_public_key != api_gateway_internal_public_key
      - storage_internal_public_key != api_gateway_internal_public_key
      - terminal_gateway_internal_public_key != api_gateway_internal_public_key
      - terminal_gateway_internal_public_key != compute_internal_public_key
      - terminal_gateway_internal_public_key != database_internal_public_key
      - terminal_gateway_internal_public_key != storage_internal_public_key
      # Per-service Postgres roles. An empty password seeds a valid-looking DSN
      # and a CNPG DatabaseRole with no password; connections are refused.
      - iam_postgresql_password | length >= 24
      - compute_postgresql_password | length >= 24
      - database_postgresql_password | length >= 24
      - storage_postgresql_password | length >= 24
      # Garage S3 credentials for storage-service's shared platform bucket.
      - garage_storage_service_access_key | length >= 16
      - garage_storage_service_secret_key | length >= 16
      # Registry pull credentials. Empty renders auth ":" into
      # zot-registry-pull-credentials and every FCI pod ImagePullBackOffs.
      - zot_registry_pull_username | length > 0
      - zot_registry_pull_password | length >= 16
      - ghcr_registry_username | length > 0
      - ghcr_registry_token | length >= 16
      - zot_registry_htpasswd | length > 0
      - zot_registry_s3_access_key_id | length >= 16
      - zot_registry_s3_secret_access_key | length >= 16
      # Cloudflare tunnel. Empty means nothing is reachable from outside.
      - cloudflared_tunnel_token | length >= 32
    fail_msg: >-
      Every value below is written to OpenBao unconditionally; an unset variable
      seeds an empty string, the ExternalSecret then syncs successfully with an
      empty value, and the failure surfaces much later as a CrashLoopBackOff or
      ImagePullBackOff with nothing pointing back at this run.

      Ed25519 PEM keypairs (must contain BEGIN PUBLIC KEY / BEGIN PRIVATE KEY
      headers and be distinct across all issuers):
        API_GATEWAY_INTERNAL_PUBLIC_KEY, API_GATEWAY_INTERNAL_SIGNING_KEY,
        TERMINAL_GATEWAY_INTERNAL_PUBLIC_KEY, TERMINAL_GATEWAY_INTERNAL_SIGNING_KEY,
        COMPUTE_INTERNAL_PUBLIC_KEY, COMPUTE_INTERNAL_SIGNING_KEY,
        DATABASE_INTERNAL_PUBLIC_KEY, DATABASE_INTERNAL_SIGNING_KEY,
        STORAGE_INTERNAL_PUBLIC_KEY, STORAGE_INTERNAL_SIGNING_KEY

      Authentik (>= 50 / 24 / 16 chars respectively):
        AUTHENTIK_SECRET_KEY, AUTHENTIK_POSTGRESQL_PASSWORD,
        AUTHENTIK_BOOTSTRAP_PASSWORD, VALKEY_PASSWORD,
        AUTHENTIK_GRAFANA_OIDC_SECRET, AUTHENTIK_ARGOCD_OIDC_SECRET,
        AUTHENTIK_ZOT_OIDC_SECRET, GRAFANA_ADMIN_PASSWORD

      Per-service Postgres (>= 24 chars each):
        IAM_POSTGRESQL_PASSWORD, COMPUTE_POSTGRESQL_PASSWORD,
        DATABASE_POSTGRESQL_PASSWORD, STORAGE_POSTGRESQL_PASSWORD,
        PLATFORM_POSTGRESQL_PASSWORD

      Garage S3 (>= 16 chars each):
        GARAGE_STORAGE_SERVICE_ACCESS_KEY, GARAGE_STORAGE_SERVICE_SECRET_KEY

      Registry credentials:
        ZOT_REGISTRY_PULL_USERNAME (non-empty),
        ZOT_REGISTRY_PULL_PASSWORD (>= 16 chars),
        ZOT_REGISTRY_HTPASSWD (non-empty),
        ZOT_REGISTRY_S3_ACCESS_KEY_ID (>= 16 chars),
        ZOT_REGISTRY_S3_SECRET_ACCESS_KEY (>= 16 chars),
        GHCR_REGISTRY_USERNAME (non-empty),
        GHCR_REGISTRY_TOKEN (>= 16 chars)

      Cloudflare tunnel (>= 32 chars):
        CLOUDFLARED_TUNNEL_TOKEN
  no_log: true
  tags: [openbao, bootstrap]

- name: Initialize active OpenBao endpoint discovery state
  ansible.builtin.set_fact:
    openbao_active_health: {}
    openbao_discovery_deadline_epoch: >-
      {{ (lookup('ansible.builtin.pipe', 'date +%s') | int)
         + (openbao_endpoint_discovery_timeout | int) }}
  tags: [openbao, bootstrap, authentik-token]

- name: Discover and probe current active OpenBao endpoints
  ansible.builtin.include_tasks:
    file: discover-active-endpoint.yml
    apply:
      tags: [openbao, bootstrap, authentik-token]
  loop: "{{ range(0, openbao_endpoint_discovery_attempts | int) | list }}"
  loop_control:
    loop_var: openbao_active_discovery_attempt
    label: "attempt {{ openbao_active_discovery_attempt + 1 }}"
  when:
    - (openbao_active_health.status | default(0) | int) != 200
    - >-
      lookup('ansible.builtin.pipe', 'date +%s') | int
      < openbao_discovery_deadline_epoch | int
  tags: [openbao, bootstrap, authentik-token]

- name: Require a healthy active OpenBao endpoint
  ansible.builtin.assert:
    that:
      - (openbao_active_health.status | default(0) | int) == 200
    fail_msg: >-
      No serving, non-terminating OpenBao endpoint returned HTTP 200 after
      the shared {{ openbao_endpoint_discovery_timeout }}-second discovery window.
      Each attempt refreshed the active Service's EndpointSlices before probing
      candidates.
  tags: [openbao, bootstrap, authentik-token]

- name: Read enabled OpenBao secret engines
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/mounts"
    method: GET
    validate_certs: false
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    status_code: 200
    return_content: true
  register: openbao_mounts
  no_log: true
  delegate_to: "{{ openbao_api_delegate }}"
  tags: [openbao, bootstrap]

- name: Enable the versioned KV secret engine
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/mounts/secret"
    method: POST
    validate_certs: false
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    status_code: [200, 204]
  when: "'secret/' not in openbao_mounts.json"
  no_log: true
  delegate_to: "{{ openbao_api_delegate }}"
  tags: [openbao, bootstrap]

- name: Install least-privilege External Secrets policy
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/policies/acl/external-secrets-read"
    method: PUT
    validate_certs: false
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body:
      policy: |
        path "secret/data/api-gateway" {
          capabilities = ["read"]
        }
        path "secret/metadata/api-gateway" {
          capabilities = ["read"]
        }
        path "secret/data/authentik" {
          capabilities = ["read"]
        }
        path "secret/metadata/authentik" {
          capabilities = ["read"]
        }
        path "secret/data/cloudflared" {
          capabilities = ["read"]
        }
        path "secret/metadata/cloudflared" {
          capabilities = ["read"]
        }
        path "secret/data/compute" {
          capabilities = ["read"]
        }
        path "secret/metadata/compute" {
          capabilities = ["read"]
        }
        path "secret/data/database" {
          capabilities = ["read"]
        }
        path "secret/metadata/database" {
          capabilities = ["read"]
        }
        path "secret/data/garage" {
          capabilities = ["read"]
        }
        path "secret/metadata/garage" {
          capabilities = ["read"]
        }
        path "secret/data/grafana" {
          capabilities = ["read"]
        }
        path "secret/metadata/grafana" {
          capabilities = ["read"]
        }
        path "secret/data/iam" {
          capabilities = ["read"]
        }
        path "secret/metadata/iam" {
          capabilities = ["read"]
        }
        path "secret/data/platform-postgresql" {
          capabilities = ["read"]
        }
        path "secret/metadata/platform-postgresql" {
          capabilities = ["read"]
        }
        path "secret/data/storage" {
          capabilities = ["read"]
        }
        path "secret/metadata/storage" {
          capabilities = ["read"]
        }
        path "secret/data/terminal-gateway" {
          capabilities = ["read"]
        }
        path "secret/metadata/terminal-gateway" {
          capabilities = ["read"]
        }
        path "secret/data/valkey" {
          capabilities = ["read"]
        }
        path "secret/metadata/valkey" {
          capabilities = ["read"]
        }
        path "secret/data/zot-registry" {
          capabilities = ["read"]
        }
        path "secret/metadata/zot-registry" {
          capabilities = ["read"]
        }
    status_code: [200, 204]
  no_log: true
  delegate_to: "{{ openbao_api_delegate }}"
  tags: [openbao, bootstrap]

- name: Read enabled OpenBao auth methods
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/auth"
    method: GET
    validate_certs: false
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    status_code: 200
    return_content: true
  register: openbao_auth_methods
  no_log: true
  delegate_to: "{{ openbao_api_delegate }}"
  tags: [openbao, bootstrap]

- name: Enable OpenBao Kubernetes authentication
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/auth/kubernetes"
    method: POST
    validate_certs: false
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body:
      type: kubernetes
    status_code: [200, 204]
  when: "'kubernetes/' not in openbao_auth_methods.json"
  no_log: true
  delegate_to: "{{ openbao_api_delegate }}"
  tags: [openbao, bootstrap]

- name: Configure OpenBao Kubernetes authentication
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/kubernetes/config"
    method: POST
    validate_certs: false
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body:
      kubernetes_host: https://kubernetes.default.svc:443
    status_code: [200, 204]
  no_log: true
  delegate_to: "{{ openbao_api_delegate }}"
  tags: [openbao, bootstrap]

- name: Bind External Secrets service account to the read policy
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/kubernetes/role/{{ openbao_kubernetes_auth_role }}"
    method: POST
    validate_certs: false
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body:
      bound_service_account_names:
        - "{{ openbao_external_secrets_service_account }}"
      bound_service_account_namespaces:
        - "{{ openbao_external_secrets_namespace }}"
      audience: "{{ openbao_external_secrets_audience }}"
      policies:
        - external-secrets-read
      token_ttl: 10m
      token_max_ttl: 30m
    status_code: [200, 204]
  no_log: true
  delegate_to: "{{ openbao_api_delegate }}"
  tags: [openbao, bootstrap]


- name: Seed application secrets in OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/{{ item.path }}"
    method: POST
    validate_certs: false
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body:
      data: "{{ item.data }}"
    status_code: [200, 204]
  loop: "{{ openbao_secrets }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true
  delegate_to: "{{ openbao_api_delegate }}"
  tags: [openbao, bootstrap]

# Authentik admin token — seeded in a separate second run once the Authentik
# bootstrap admin exists (sync-wave 5). The include is skipped on the first run
# when authentik_admin_token is empty; --tags authentik-token runs it directly
# and the assert inside authentik-token.yml fails loudly if the token is absent.
- name: Seed the Authentik admin token when supplied
  ansible.builtin.include_tasks: authentik-token.yml
  when: authentik_admin_token | length > 0
  tags: [openbao, authentik-token]

- name: Report that the Authentik admin token still needs a second run
  ansible.builtin.debug:
    msg: >-
      AUTHENTIK_ADMIN_TOKEN was not supplied. Bootstrap is complete, but
      iam-service Authentik user sync is inert until the second run — see
      README.md. Rerun with --tags authentik-token once Authentik is up.
  when: authentik_admin_token | length == 0
  tags: [openbao, authentik-token]
