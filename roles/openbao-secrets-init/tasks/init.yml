---
- name: Check OpenBao initialization status
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/init"
    method: GET
    validate_certs: false
    status_code: 200
  register: openbao_init_status
  delegate_to: "{{ openbao_api_delegate }}"

- name: Initialize OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/init"
    method: PUT
    validate_certs: false
    body_format: json
    body:
      secret_shares: 5
      secret_threshold: 3
    status_code: 200
  register: openbao_init_result
  delegate_to: "{{ openbao_api_delegate }}"
  when: not openbao_init_status.json.initialized | bool
  changed_when: openbao_init_result.status == 200
  no_log: true

- name: Store OpenBao keys on master-1 securely
  ansible.builtin.copy:
    content: "{{ openbao_init_result.json | to_nice_json }}"
    dest: /root/openbao-cluster-keys.json
    mode: '0400'
    owner: root
    group: root
  delegate_to: master-1
  when: openbao_init_result.changed
  no_log: true

- name: Stat OpenBao keys on master-1
  ansible.builtin.stat:
    path: /root/openbao-cluster-keys.json
  register: openbao_keys_stat
  delegate_to: master-1

- name: Abort if OpenBao is sealed but keys are missing
  ansible.builtin.fail:
    msg: "OpenBao is sealed (HTTP 503) but /root/openbao-cluster-keys.json is missing on master-1. You must unseal manually or restore the keys."
  when: 
    - (openbao_health.status | default(0) | int) == 503
    - not openbao_keys_stat.stat.exists

- name: Read OpenBao keys from master-1
  ansible.builtin.slurp:
    src: /root/openbao-cluster-keys.json
  register: openbao_keys_file
  delegate_to: master-1
  no_log: true

- name: Set keys facts
  ansible.builtin.set_fact:
    openbao_bootstrap_token: "{{ (openbao_keys_file.content | b64decode | from_json).root_token }}"
    openbao_unseal_keys: "{{ (openbao_keys_file.content | b64decode | from_json).keys_base64 }}"
  no_log: true
