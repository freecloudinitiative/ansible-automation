---
- name: Create OpenBao stack directory
  ansible.builtin.file:
    path: "{{ openbao_stack_dir }}"
    state: directory
    mode: "0755"

- name: Add OpenBao Helm repo
  kubernetes.core.helm_repository:
    name: openbao
    repo_url: "{{ openbao_helm_repo_url }}"

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Ensure OpenBao namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ openbao_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Render OpenBao values from template
  ansible.builtin.template:
    src: openbao-values.yaml.j2
    dest: "{{ openbao_stack_dir }}/openbao-values.yaml"
    mode: "0644"

- name: Install OpenBao via Helm
  kubernetes.core.helm:
    name: "{{ openbao_release_name }}"
    chart_ref: openbao/openbao
    chart_version: "{{ openbao_chart_version | default(omit, true) if (openbao_chart_version | default('') | length > 0) else omit }}"
    release_namespace: "{{ openbao_namespace }}"
    create_namespace: false
    values_files:
      - "{{ openbao_stack_dir }}/openbao-values.yaml"
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_timeout: 5m
    state: present

- name: Wait for OpenBao statefulset pod to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --for=condition=Ready
      - "pod/{{ openbao_release_name }}-0"
      - -n
      - "{{ openbao_namespace }}"
      - --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Get OpenBao pods
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - -n
      - "{{ openbao_namespace }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: openbao_pods
  changed_when: false

- name: Display OpenBao pods info
  ansible.builtin.debug:
    msg: "{{ openbao_pods.stdout_lines }}"

- name: Determine OpenBao CLI target architecture
  ansible.builtin.set_fact:
    openbao_arch: "{{ openbao_arch_map[ansible_facts.architecture] | default('amd64') }}"
  when: openbao_cli_install | bool

- name: Download and install OpenBao CLI binary
  ansible.builtin.unarchive:
    src: "https://github.com/openbao/openbao/releases/download/v{{ openbao_cli_version }}/bao_{{ openbao_cli_version }}_linux_{{ openbao_arch }}.tar.gz"
    dest: "{{ openbao_cli_install_dir }}"
    remote_src: true
    include:
      - bao
    mode: "0755"
    creates: "{{ openbao_cli_install_dir }}/bao"
  when: openbao_cli_install | bool

- name: Ensure OpenBao environment profile script is set
  ansible.builtin.copy:
    dest: /etc/profile.d/openbao.sh
    content: |
      export VAULT_ADDR="http://127.0.0.1:{{ openbao_node_port }}"
      export BAO_ADDR="http://127.0.0.1:{{ openbao_node_port }}"
    mode: "0755"
  when: openbao_cli_install | bool
