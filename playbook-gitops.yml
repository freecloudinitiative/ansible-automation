---
- name: Pre-setup all nodes
  hosts: all
  become: true
  roles:
    - k3s-pre-setup

- name: Setup primary K3s master node
  hosts: "{{ groups['masters'][0] }}"
  become: true
  vars:
    k3s_master_public_ip:  "x.x.x.x"
  roles:
    - k3s-master-setup
    - k3s-fact-gathering

- name: Setup secondary K3s master nodes
  hosts: "{{ groups['masters'][1:] }}"
  become: true
  vars:
    k3s_master_ip: "{{ hostvars[groups['masters'][0]]['k3s_master_ip'] }}"
    k3s_node_token: "{{ hostvars[groups['masters'][0]]['k3s_node_token']['content'] | b64decode | trim }}"
  roles:
    - k3s-master-setup

- name: Setup K3s worker nodes
  hosts: workers
  become: true
  vars:
    k3s_master_ip: "{{ hostvars[groups['masters'][0]]['k3s_master_ip'] }}"
    k3s_node_token: "{{ hostvars[groups['masters'][0]]['k3s_node_token']['content'] | b64decode | trim }}"
  roles:
    - k3s-worker-setup

- name: Install K3S Components
  hosts: "{{ groups['masters'][0] }}"
  become: true
  vars:
    k3s_master_ip: "{{ hostvars[groups['masters'][0]]['k3s_master_ip'] }}"
    k3s_master_public_ip: "{{ hostvars[groups['masters'][0]]['k3s_master_public_ip'] }}"
    k3s_node_token: "{{ hostvars[groups['masters'][0]]['k3s_node_token']['content'] | b64decode | trim }}"
    port_forward_enabled: true
    port_forward_address: "0.0.0.0"
    kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
  roles:
    - k3s-node-labeling
    - k9s-setup
    - argocd-setup
    - gitea-setup
    - gitea-repo-sync
    - gitea-act-runner-setup
    - argocd-bootstrap