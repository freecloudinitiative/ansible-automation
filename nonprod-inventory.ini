[masters]
master-1 master_label=master-1 ansible_host=nonprod-master-1

[workers]
worker-1 worker_label=worker-1 ansible_host=nonprod-worker-1
worker-2 worker_label=worker-2 ansible_host=nonprod-worker-2
worker-3 worker_label=worker-3 ansible_host=nonprod-worker-3
worker-4 worker_label=worker-4 ansible_host=nonprod-worker-4

[high_memory]
worker-1 worker_label=worker-1
worker-2 worker_label=worker-2

[mid_memory]
worker-4 worker_label=worker-4

[low_memory]
worker-3 worker_label=worker-3

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/fci_keypair.pem
