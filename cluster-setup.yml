---
- name: Pre-setup all nodes
  hosts: all
  become: true
  gather_facts: true
  roles:
    - k3s-pre-setup

- name: Setup primary K3s master node
  hosts: "{{ groups['masters'][0] }}"
  become: true
  gather_facts: true
  roles:
    - k3s-master-setup
    - k3s-fact-gathering
    - k3s-pre-setup

- name: Setup secondary K3s master nodes
  hosts: "{{ groups['masters'][1:] }}"
  become: true
  gather_facts: true
  vars:
    k3s_node_token: "{{ hostvars[groups['masters'][0]]['k3s_node_token']['content'] | b64decode | trim }}"
  roles:
    - k3s-pre-setup
    - k3s-master-setup

- name: Setup K3s worker nodes
  hosts: workers
  become: true
  gather_facts: true
  vars:
    k3s_node_token: "{{ hostvars[groups['masters'][0]]['k3s_node_token']['content'] | b64decode | trim }}"
  roles:
    - k3s-pre-setup
    - k3s-worker-setup

- name: Install K3S Components
  hosts: "{{ groups['masters'][0] }}"
  become: true
  gather_facts: false
  vars:
    k3s_node_token: "{{ hostvars[groups['masters'][0]]['k3s_node_token']['content'] | b64decode | trim }}"
  roles:
    - k3s-node-labeling
    - k9s-setup
    - argocd-setup
    - gitea-setup
    - gitea-act-runner-setup
    - docker-registry-setup
    - sealed-secret-setup
    - traefik-setup
    - cert-manager-setup
    - prometheus-stack-setup
    - alloy-setup
    - loki-setup
    - tempo-setup
    - open-telemetry-setup
    - kyverno-setup
    - metallb-setup
