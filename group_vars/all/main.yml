---
# Consumed by k3s-worker-setup and k3s-master-setup as the join URL:
# --server=https://{{ k3s_master1_public_ip }}:6443
# Leave blank to auto-resolve master-1's own LAN address
# (ansible_facts.default_ipv4.address) during the masters play -- the
# right choice for an all-local fleet, where there's no public IP to give
# anyway. Set an explicit value here (or via -e k3s_master1_public_ip=<ip>)
# only when nodes are NOT all on the same network, e.g. a cloud master
# with a real public/reachable IP.
k3s_master1_public_ip: ""
k3s_worker1_public_ip: ""
k3s_worker2_public_ip: ""
k3s_worker3_public_ip: ""
k3s_worker4_public_ip: ""
k3s_worker5_public_ip: ""
k3s_worker6_public_ip: ""
k3s_master2_public_ip: ""
k3s_master3_public_ip: ""
